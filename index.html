    if (typeof Views !== 'undefined' && Views.updateSyncStatusUI) Views.updateSyncStatusUI();
    try {
      const res = await fetch(SYNC_CONFIG.url + '?on_conflict=sync_code', {
        method: 'POST',
        headers: { ...Sync.headers(), 'Prefer': 'resolution=merge-duplicates,return=minimal' },
        body: JSON.stringify({ sync_code: Sync.code, data: Store.data, updated_at: new Date().toISOString() }),
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      Sync.status = 'ok'; Sync.lastSyncAt = new Date(); Sync.lastError = null;
    } catch (e) {
      Sync.status = 'error'; Sync.lastError = e && e.message;
      console.warn('Cloud-Sync (Push) fehlgeschlagen — App läuft unverändert lokal weiter.', e);
    }
    if (typeof Views !== 'undefined' && Views.updateSyncStatusUI) Views.updateSyncStatusUI();
  },
  async pull() {
    if (!Sync.code || typeof fetch !== 'function') return null;
    try {
      const res = await fetch(SYNC_CONFIG.url + '?sync_code=eq.' + encodeURIComponent(Sync.code) + '&select=data,updated_at', { headers: Sync.headers() });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const rows = await res.json();
      return rows && rows.length ? rows[0].data : null;
    } catch (e) {
      Sync.lastError = e && e.message;
      console.warn('Cloud-Sync (Pull) fehlgeschlagen.', e);
      return null;
    }
  },
  async tryAutoRestore() {
    if (Sync.isLocalEmpty(Store.data)) {
      const remote = await Sync.pull();
      if (remote) {
        Store.data = Store.migrate(remote);
        Store.save({ skipSync: true });
        if (typeof Router !== 'undefined') Router.render();
        UI.toast('Daten aus der Cloud wiederhergestellt ✓', 'success');
      }
    } else {
      Sync.push();
    }
  },
  async manualBackupNow() {
    if (!Sync.code) { UI.toast('Bitte zuerst einen Sync-Code einrichten.', 'error'); return; }
    await Sync.push();
    UI.toast(Sync.status === 'ok' ? 'In der Cloud gesichert ✓' : 'Sicherung fehlgeschlagen — später erneut versuchen.', Sync.status === 'ok' ? 'success' : 'error');
  },
  async manualRestore() {
    if (!Sync.code) { UI.toast('Bitte zuerst einen Sync-Code einrichten.', 'error'); return; }
    const remote = await Sync.pull();
    if (!remote) { UI.toast('Kein Cloud-Backup für diesen Code gefunden.', 'error'); return; }
    Store.data = Store.migrate(remote);
    Store.save({ skipSync: true });
    Router.render();
    UI.toast('Aus der Cloud wiederhergestellt ✓', 'success');
  },
};

/* ---------------------------------------------------------
   Lokale KI — regelbasierte Auswertung ausschließlich der
   eigenen gespeicherten Daten. Keine Cloud, kein Internet.
--------------------------------------------------------- */
const AI = {
  history: [],
  escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); },
  foodSearchKey(name) { return name.replace(/\s*\([^)]*\)\s*/g, '').trim(); },
  findFoodMention(text) {
    const wantsRaw = /(ungekocht|roh\b|trocken)/i.test(text);
    const matches = [];
    Store.data.foods.forEach(f => {
      const key = AI.foodSearchKey(f.name);
      if (!key) return;
      const re = new RegExp('\\b' + AI.escapeRegex(key) + '\\b', 'i');
      if (re.test(text)) matches.push(f);
    });
    if (!matches.length) return null;
    matches.sort((a, b) => AI.foodSearchKey(b.name).length - AI.foodSearchKey(a.name).length);
    const topKey = AI.foodSearchKey(matches[0].name);
    const sameKey = matches.filter(f => AI.foodSearchKey(f.name) === topKey);
    if (sameKey.length > 1) {
      const raw = sameKey.find(f => /ungekocht|roh/i.test(f.name));
      const cooked = sameKey.find(f => !/ungekocht|roh/i.test(f.name));
      return (wantsRaw ? raw : cooked) || sameKey[0];
    }
    return matches[0];
  },
  parseFoodMention(text) {
    const food = AI.findFoodMention(text);
    if (!food) return null;
    let amount = food.unit === 'stk' ? 1 : 100;
    const m = text.match(/(\d+(?:[.,]\d+)?)\s*(g|gramm|stk|stück|st\.)?/i);
    if (m && m[1]) amount = Number(m[1].replace(',', '.'));
    return { food, amount };
  },
  parseMacroTarget(text) {
    const re = /(\d+(?:[.,]\d+)?)\s*g\s*(protein|eiweiß|kohlenhydrate|carbs|fett|ballaststoffe)/i;
    const m = text.match(re);
    if (!m) return null;
    const amount = Number(m[1].replace(',', '.'));
    const map = { protein: 'protein', 'eiweiß': 'protein', kohlenhydrate: 'carbs', carbs: 'carbs', fett: 'fat', ballaststoffe: 'fiber' };
    return { macro: map[m[2].toLowerCase()], amount, label: m[2] };
  },
  foodFitMessage(food, amount) {
    const factor = amount / food.ref;
    const macros = { kcal: food.kcal * factor, protein: food.protein * factor, carbs: food.carbs * factor, fat: food.fat * factor };
    const totals = Nutrition.getDayTotals(Utils.todayLocal());
    const g = Store.data.goals;
    const newKcal = totals.kcal + macros.kcal;
    const unitLabel = food.unit === 'stk' ? 'Stk' : 'g';
    const fits = newKcal <= g.kcal * 1.05;
    let msg = `${amount}${unitLabel} **${food.name}** hat etwa ${Utils.round(macros.kcal)} kcal und ${Utils.round1(macros.protein)}g Protein. `;
    msg += fits
      ? `Damit kommst du auf ${Utils.round(newKcal)} von ${g.kcal} kcal — passt in dein Tagesziel (danach noch ${Utils.round(Math.max(0, g.kcal - newKcal))} kcal übrig).`
      : `Damit kämst du auf ${Utils.round(newKcal)} kcal — das liegt ${Utils.round(newKcal - g.kcal)} kcal über deinem Ziel von ${g.kcal} kcal.`;
    return msg;
  },
  findExerciseInText(text) {
    const t = text.toLowerCase();
    const all = [...new Set([...Store.data.exercises.map(e => e.name), ...Store.data.workouts.flatMap(w => (w.exercises || []).map(e => e.name))])];
    let found = null;
    all.forEach(name => {
      const re = new RegExp('\\b' + AI.escapeRegex(name.toLowerCase()) + '\\b', 'i');
      if (re.test(t) && (!found || name.length > found.length)) found = name;
    });
    return found;
  },
  findGroupInText(text) {
    const t = text.toLowerCase();
    return MUSCLE_GROUPS.find(g => t.includes(g.toLowerCase())) || null;
  },
  parseGermanDate(text) {
    const months = Utils.monthNamesDe;
    const re = /(\d{1,2})\.\s*(januar|februar|märz|april|mai|juni|juli|august|september|oktober|november|dezember)(?:\s+(\d{4}))?/i;
    const m = text.match(re);
    if (m) {
      const day = Number(m[1]);
      const monthIdx = months.findIndex(mn => mn.toLowerCase() === m[2].toLowerCase());
      const year = m[3] ? Number(m[3]) : new Date().getFullYear();
      const d = new Date(year, monthIdx, day);
      return Utils.toLocalISODate(d);
    }
    const re2 = /(\d{1,2})[.\/](\d{1,2})[.\/](\d{2,4})/;
    const m2 = text.match(re2);
    if (m2) {
      let year = Number(m2[3]); if (year < 100) year += 2000;
      const d = new Date(year, Number(m2[2]) - 1, Number(m2[1]));
      return Utils.toLocalISODate(d);
    }
    return null;
  },
  ask(question) {
    const q = question.trim();
    const ql = q.toLowerCase();
    try {
      // Datum-spezifische Trainingsabfrage
      const parsedDate = AI.parseGermanDate(ql);
      if (parsedDate && /(training|workout|einheit)/.test(ql)) {
        const ws = Training.getWorkoutsOnDate(parsedDate);
        if (!ws.length) return `Am ${Utils.fmtDateHuman(parsedDate)} habe ich kein Training gefunden.`;
        return ws.map(w => `**${w.name}** am ${Utils.fmtDateHuman(w.date)}: ${(w.exercises || []).map(ex => `${ex.name} (${ex.sets.length} Sätze)`).join(', ') || 'keine Übungen erfasst'}.`).join('\n');
      }
      // Push-Tage
      if (/push[- ]?tage|alle push/.test(ql)) {
        const ws = Store.data.workouts.filter(w => /push/i.test(w.name) && w.date <= Utils.todayLocal());
        if (!ws.length) return 'Ich habe keine Trainings gefunden, deren Name „Push" enthält.';
        return `Gefundene Push-Tage (${ws.length}): ` + ws.map(w => Utils.fmtDateShort(w.date)).join(', ');
      }

      // ================= Lebensmittel-bezogene Fragen (persönlicher Ernährungsassistent) =================
      const foodMention = AI.parseFoodMention(q);
      if (foodMention) {
        const { food, amount } = foodMention;
        const unitLabel = food.unit === 'stk' ? 'Stk' : 'g';
        const factor = amount / food.ref;
        const macros = { kcal: food.kcal * factor, protein: food.protein * factor, carbs: food.carbs * factor, fat: food.fat * factor };
        // "Bessere Alternative zu X"
        if (/alternative/.test(ql)) {
          const alts = Nutrition.suggestAlternativeFood(food);
          return alts.length
            ? `Alternativen zu **${food.name}** mit mehr Protein pro Kalorie: ${alts.map(a => a.name).join(', ')}.`
            : `Zu **${food.name}** habe ich keine Alternative mit besserem Protein-Kalorien-Verhältnis in deiner Lebensmittel-Datenbank gefunden.`;
        }
        // "Wie viel ... kann ich noch essen / maximal", ohne dass nach Kalorien/Protein-Gehalt selbst gefragt wird
        if (/wie ?viel/.test(ql) && /(noch|maximal)/.test(ql) && !/(wie viele?|wieviel).*(kalorien|kcal|protein|eiweiß)/.test(ql)) {
          const max = Nutrition.maxAmountFitting(food);
          return max.amount <= 0
            ? `Dein Budget ist für heute praktisch ausgeschöpft — von **${food.name}** passt aktuell nichts mehr rein, ohne dein Ziel zu überschreiten.`
            : `Von **${food.name}** könntest du noch etwa **${max.amount}${max.unit}** essen, ohne dein Tagesziel zu überschreiten (limitierender Faktor: ${max.limiter}).`;
        }
        // Reine Nährwert-Frage ("wie viele Kalorien/Protein hat...")
        if (/(wie viele?|wieviel).*(kalorien|kcal|protein|eiweiß)/.test(ql) && /(hat|hätte|enthält|drin)/.test(ql)) {
          return `${amount}${unitLabel} **${food.name}** haben etwa ${Utils.round(macros.kcal)} kcal, ${Utils.round1(macros.protein)}g Protein, ${Utils.round1(macros.carbs)}g Kohlenhydrate und ${Utils.round1(macros.fat)}g Fett.`;
        }
        // Alles mit "essen"/"passt"/"kann ich"/"cut" -> Tages-Fit-Check
        if (/essen|passt|passe|kann ich|cut/.test(ql)) {
          return AI.foodFitMessage(food, amount);
        }
        // Fallback bei erkanntem Lebensmittel ohne klare Frageart: kurze Nährwert-Auskunft
        return `${amount}${unitLabel} **${food.name}**: ${Utils.round(macros.kcal)} kcal, ${Utils.round1(macros.protein)}g Protein, ${Utils.round1(macros.carbs)}g Kohlenhydrate, ${Utils.round1(macros.fat)}g Fett.`;
      }

      // "Was kann ich essen, wenn mir noch 50g Protein fehlen?"
      const macroTarget = AI.parseMacroTarget(ql);
      if (macroTarget && /(essen|kann ich)/.test(ql)) {
        const macroLabelDe = { protein: 'Protein', carbs: 'Kohlenhydrate', fat: 'Fett', fiber: 'Ballaststoffe' }[macroTarget.macro];
        const suggestions = Nutrition.suggestFoodsForMacro(macroTarget.macro, macroTarget.amount);
        if (!suggestions.length) return 'Dafür habe ich keine passenden Lebensmittel in deiner Datenbank gefunden.';
        const list = suggestions.map(s => `${s.neededAmount}${s.food.unit === 'stk' ? ' Stk' : 'g'} ${s.food.name}`).join(', ');
        return `Um ${macroTarget.amount}g ${macroLabelDe} zu decken, zum Beispiel: ${list}.`;
      }
      // "Habe ich heute genug Protein gegessen?"
      if (/(genug|ausreichend).*(protein|eiweiß).*(gegessen|gehabt|zu mir)/.test(ql)) {
        const t = Nutrition.getDayTotals(Utils.todayLocal());
        const g = Store.data.goals;
        return t.protein >= g.protein
          ? `Ja — du hast heute **${Utils.round1(t.protein)}g Protein** gegessen, dein Ziel liegt bei ${g.protein}g.`
          : `Noch nicht ganz — bisher **${Utils.round1(t.protein)}g** von ${g.protein}g Protein, dir fehlen noch ${Utils.round1(g.protein - t.protein)}g.`;
      }
      // "Wie kann ich mein Tagesziel noch erreichen?"
      if (/tagesziel.*(erreichen|schaffen)/.test(ql)) {
        const t = Nutrition.getDayTotals(Utils.todayLocal());
        const g = Store.data.goals;
        const parts = [];
        if (g.protein - t.protein > 0) parts.push(`noch ${Utils.round1(g.protein - t.protein)}g Protein`);
        if (g.kcal - t.kcal > 20) parts.push(`noch ${Utils.round(g.kcal - t.kcal)} kcal Spielraum`);
        if (g.fiberMin - t.fiber > 0) parts.push(`noch ${Utils.round1(g.fiberMin - t.fiber)}g Ballaststoffe`);
        if (!parts.length) return 'Du hast deine wichtigsten Tagesziele bereits erreicht — stark!';
        return `Um dein Tagesziel zu erreichen, fehlen dir aktuell: ${parts.join(', ')}. Eine proteinreiche, ballaststoffreiche Mahlzeit würde das am effizientesten schließen.`;
      }
      // "Was kann ich jetzt noch essen?" (allgemein, ohne konkretes Lebensmittel/Makro)
      if (/was (kann|könnte) ich.*essen/.test(ql)) {
        const sug = Nutrition.suggestFoodsGeneral();
        if (!sug) return 'Dein Kalorienbudget für heute ist praktisch ausgeschöpft — für heute passt nicht mehr viel dazu.';
        const list = sug.items.map(f => f.name).join(', ');
        return `Du hast noch ${sug.remainingKcal} kcal${sug.remainingProtein > 0 ? ` und ${sug.remainingProtein}g Protein` : ''} übrig. ${sug.preferProtein ? 'Da dir noch Protein fehlt, passen z. B.' : 'Zum Beispiel passen'}: ${list}.`;
      }

      // Kalorien übrig
      if (/kalorien/.test(ql) && /(übrig|rest|noch)/.test(ql)) {
        const t = Nutrition.getDayTotals(Utils.todayLocal());
        const rest = Store.data.goals.kcal - t.kcal;
        return rest >= 0
          ? `Du hast heute noch **${Utils.round(rest)} kcal** übrig (bisher ${Utils.round(t.kcal)} von ${Store.data.goals.kcal} kcal).`
          : `Du liegst heute **${Utils.round(-rest)} kcal über** deinem Ziel (${Utils.round(t.kcal)} von ${Store.data.goals.kcal} kcal).`;
      }
      // Protein fehlt/übrig
      if (/protein/.test(ql) && /(übrig|fehlt|rest|noch)/.test(ql)) {
        const t = Nutrition.getDayTotals(Utils.todayLocal());
        const rest = Store.data.goals.protein - t.protein;
        return rest > 0
          ? `Dir fehlen noch **${Utils.round1(rest)} g Protein** bis zu deinem Ziel von ${Store.data.goals.protein} g (bisher ${Utils.round1(t.protein)} g).`
          : `Dein Protein-Ziel ist bereits erreicht — ${Utils.round1(t.protein)} g von ${Store.data.goals.protein} g. `;
      }
      // Kohlenhydrate übrig
      if (/kohlenhydrate|carbs/.test(ql) && /(übrig|fehlt|rest|noch)/.test(ql)) {
        const t = Nutrition.getDayTotals(Utils.todayLocal());
        const rest = Store.data.goals.carbs - t.carbs;
        return `Kohlenhydrate bisher: ${Utils.round1(t.carbs)} g von ${Store.data.goals.carbs} g — ${rest >= 0 ? `noch **${Utils.round1(rest)} g** übrig.` : `**${Utils.round1(-rest)} g** über dem Ziel.`}`;
      }
      // Fett übrig
      if (/fett/.test(ql) && /(übrig|fehlt|rest|noch)/.test(ql)) {
        const t = Nutrition.getDayTotals(Utils.todayLocal());
        const rest = Store.data.goals.fat - t.fat;
        return `Fett bisher: ${Utils.round1(t.fat)} g von ${Store.data.goals.fat} g — ${rest >= 0 ? `noch **${Utils.round1(rest)} g** übrig.` : `**${Utils.round1(-rest)} g** über dem Ziel.`}`;
      }
      // Ballaststoffe übrig/fehlen
      if (/ballaststoffe/.test(ql) && /(übrig|fehlt|rest|noch)/.test(ql)) {
        const t = Nutrition.getDayTotals(Utils.todayLocal());
        const rest = Store.data.goals.fiberMin - t.fiber;
        return `Ballaststoffe bisher: ${Utils.round1(t.fiber)} g von mind. ${Store.data.goals.fiberMin} g — ${rest > 0 ? `noch **${Utils.round1(rest)} g** übrig.` : 'Ziel bereits erreicht ✓'}`;
      }
      // Welche Mahlzeit passt heute noch am besten / passt das in meinen Cut (ohne konkretes Lebensmittel)
      if (/mahlzeit.*(passt|passen)/.test(ql) || /passt.*(heute|noch).*(plan|essen)/.test(ql) || /cut/.test(ql)) {
        const t = Nutrition.getDayTotals(Utils.todayLocal());
        const restKcal = Store.data.goals.kcal - t.kcal, restP = Store.data.goals.protein - t.protein;
        if (restKcal <= 50) return 'Dein Kalorienbudget für heute ist praktisch ausgeschöpft — leichte, proteinreiche Optionen (z. B. Magerquark) passen am ehesten noch.';
        return `Du hast noch ${Utils.round(restKcal)} kcal und ${Utils.round1(Math.max(0, restP))} g Protein übrig. Eine proteinreiche, kalorienbewusste Mahlzeit (z. B. Hähnchenbrust mit Gemüse) passt jetzt am besten in deinen Plan.`;
      }
      // Gewichtsentwicklung
      if (/gewicht/.test(ql) && /(entwickl|verlauf|trend)/.test(ql)) {
        const series = BodyData.series('weight');
        if (series.length < 2) return 'Dafür habe ich noch zu wenig Gewichtsdaten. Trage regelmäßig dein Körpergewicht ein (Körperdaten).';
        const diff = series[series.length - 1].y - series[0].y;
        return `Dein Gewicht hat sich von ${Utils.round1(series[0].y)} kg auf ${Utils.round1(series[series.length - 1].y)} kg verändert (${diff >= 0 ? '+' : ''}${Utils.round1(diff)} kg seit ${Utils.fmtDateHuman(series[0].x)}).`;
      }
      // ================= Trainingsfragen (persönlicher Trainingsassistent) =================
      // "Welche Übung trainiert diese Muskelgruppe?"
      if (/welche (übung|übungen).*(trainiert|für)|übungen für/.test(ql)) {
        const group = AI.findGroupInText(ql);
        if (group) {
          const names = Training.exercisesInGroup(group);
          return names.length ? `Übungen für **${group}**: ${names.join(', ')}.` : `Für **${group}** habe ich noch keine Übungen in deiner Liste.`;
        }
      }
      // "Welche Übung kann ich ersetzen?" / "Alternative zu X"
      if (/(ersetzen|alternative)/.test(ql) && !/lebensmittel/.test(ql)) {
        const exName = AI.findExerciseInText(ql);
        if (exName) {
          const alts = Training.alternativesForExercise(exName);
          return alts.length
            ? `Statt **${exName}** könntest du z. B. folgende Übungen für dieselbe Muskelgruppe nutzen: ${alts.join(', ')}.`
            : `Für **${exName}** habe ich keine Alternative aus derselben Muskelgruppe in deiner Liste gefunden.`;
        }
      }
      // "Wie viele Sätze und Wiederholungen sollte ich machen?"
      if (/(sätze|wiederholungen).*(machen|sollte)|wie viele (sätze|wiederholungen)/.test(ql)) {
        return 'Faustregel: 3–4 Sätze à 8–12 Wiederholungen für Muskelaufbau, 3–5 Sätze à 3–6 Wiederholungen mit mehr Gewicht für reinen Kraftfokus — jeweils nah am Muskelversagen (RPE 7–9). Das ist allgemeine Orientierung, keine individuelle Trainingsplanung.';
      }
      // "Habe ich diese Muskelgruppe diese Woche ausreichend trainiert?"
      if (/(ausreichend|genug).*trainiert|trainiert.*(ausreichend|genug)/.test(ql)) {
        const group = AI.findGroupInText(ql);
        if (group) {
          const from = Utils.startOfWeek(Utils.todayLocal());
          const sessions = Store.data.workouts.filter(w => w.date >= from && w.date <= Utils.todayLocal() && (w.exercises || []).some(ex => ex.group === group)).length;
          const enough = sessions >= 2;
          return `Du hast **${group}** diese Woche an ${sessions} Tag(en) trainiert. ${enough ? 'Das ist eine solide Frequenz (Richtwert: mind. 2×/Woche für Muskelaufbau).' : 'Richtwert für Muskelaufbau sind mind. 2×/Woche pro Muskelgruppe — da geht noch etwas.'}`;
        }
      }
      // "Wie kann ich meinen Trainingsplan verbessern?"
      if (/trainingsplan.*(verbessern|optimieren)/.test(ql)) {
        const map = Training.volumeByMuscleGroup(Utils.addDays(Utils.todayLocal(), -28));
        const withData = MUSCLE_GROUPS.filter(g => g !== 'Cardio' && g !== 'Ganzkörper').map(g => ({ g, v: map[g] || 0 }));
        withData.sort((a, b) => a.v - b.v);
        const lowest = withData[0], highest = withData[withData.length - 1];
        if (!highest || highest.v === 0) return 'Dafür fehlen mir noch genug Trainingsdaten der letzten 4 Wochen. Trag ein paar Einheiten ein, dann kann ich Muskelgruppen vergleichen.';
        return `In den letzten 4 Wochen war **${highest.g}** am stärksten belastet (${Utils.round(highest.v)}kg), **${lowest.g}** am wenigsten (${Utils.round(lowest.v)}kg). Etwas mehr Fokus auf ${lowest.g} könnte deinen Plan ausgewogener machen.`;
      }
      // Bankdrücken / beliebige Übung verbessert
      if (/(verbessert|fortschritt|entwicklung)/.test(ql)) {
        const exName = AI.findExerciseInText(ql);
        if (exName) {
          const stats = Training.exerciseStats(exName);
          if (!stats) return `Zu **${exName}** habe ich noch keine Sätze gefunden.`;
          const first = stats.sets[0], last = stats.sets[stats.sets.length - 1];
          const e1First = Training.estimate1RM(first.weight, first.reps), e1Last = Training.estimate1RM(last.weight, last.reps);
          const diffPct = e1First > 0 ? Utils.round1((e1Last - e1First) / e1First * 100) : 0;
          return `**${exName}**: geschätztes 1RM von ${Utils.round1(e1First)} kg auf ${Utils.round1(e1Last)} kg (${diffPct >= 0 ? '+' : ''}${diffPct}%). Aktueller Bestwert: ${stats.best1rm} kg (geschätztes 1RM).`;
        }
      }
      // Welche Übung verbessert sich am schnellsten
      if (/(übung|exercise).*(schnellsten|meisten)|schnellsten.*(verbessert|besser)/.test(ql)) {
        const best = Training.fastestImproving();
        if (!best) return 'Dafür habe ich noch nicht genug Datenpunkte pro Übung (mindestens 2 Sätze nötig).';
        return `**${best.name}** verbessert sich am schnellsten: ${Utils.round1(best.firstE1)} kg → ${Utils.round1(best.lastE1)} kg geschätztes 1RM (${best.pct >= 0 ? '+' : ''}${Utils.round1(best.pct)}%).`;
      }
      // Muskelgruppe am wenigsten trainiert
      if (/muskelgruppe/.test(ql) && /(wenigsten|seltensten|vernachlässig)/.test(ql)) {
        const map = Training.volumeByMuscleGroup();
        const withData = MUSCLE_GROUPS.map(g => ({ g, v: map[g] || 0 }));
        withData.sort((a, b) => a.v - b.v);
        const min = withData[0];
        return min.v === 0
          ? `**${min.g}** hast du bisher gar nicht trainiert.`
          : `**${min.g}** hat aktuell das geringste Trainingsvolumen (${Utils.round(min.v)} kg gesamt).`;
      }
      // Trainingsvolumen letzte Woche
      if (/trainingsvolumen/.test(ql) && /(letzte woche|vorherige woche)/.test(ql)) {
        const from = Utils.addDays(Utils.startOfWeek(Utils.todayLocal()), -7), to = Utils.addDays(from, 6);
        const ws = Training.workoutsInRange(from, to);
        const vol = ws.reduce((s, w) => s + Training.volumeOfWorkout(w), 0);
        return `Dein Trainingsvolumen letzte Woche (${Utils.fmtDateShort(from)}–${Utils.fmtDateShort(to)}) betrug **${Utils.round(vol)} kg** über ${ws.length} Einheiten.`;
      }
      // Wie oft [Übung] gemacht / wie oft [Muskelgruppe] trainiert
      if (/wie oft/.test(ql)) {
        const group = AI.findGroupInText(ql);
        const exName = AI.findExerciseInText(ql);
        const weekOnly = /diese woche/.test(ql);
        const from = weekOnly ? Utils.startOfWeek(Utils.todayLocal()) : '0000-01-01';
        if (exName) {
          const count = Training.allSetsForExercise(exName).filter(s => s.date >= from).length;
          const sessions = new Set(Store.data.workouts.filter(w => w.date >= from && (w.exercises || []).some(ex => ex.name === exName)).map(w => w.date)).size;
          return `**${exName}**: ${sessions} Trainingstag(e)${weekOnly ? ' diese Woche' : ''}, insgesamt ${count} Sätze.`;
        }
        if (group) {
          const sessions = Store.data.workouts.filter(w => w.date >= from && w.date <= Utils.todayLocal() && (w.exercises || []).some(ex => ex.group === group)).length;
          return `Du hast **${group}** ${weekOnly ? 'diese Woche' : 'insgesamt'} an **${sessions}** Trainingstag(en) trainiert.`;
        }
      }
      // Trainingseinheiten diesen Monat/dieser Woche
      if (/(trainingseinheiten|trainings|workouts).*(monat|woche)/.test(ql) || /wie viele training/.test(ql)) {
        const isWeek = /woche/.test(ql);
        const from = isWeek ? Utils.startOfWeek(Utils.todayLocal()) : Utils.startOfMonth(Utils.todayLocal());
        const count = Training.workoutsInRange(from, Utils.todayLocal()).length;
        return `Du hattest ${isWeek ? 'diese Woche' : 'diesen Monat'} **${count} Trainingseinheit(en)**.`;
      }
      // Durchschnittliche Kalorien/Protein
      if (/durchschnittlich/.test(ql) && (/kalorien/.test(ql) || /protein/.test(ql))) {
        const avg = Nutrition.avgOverDays(30);
        if (!avg) return 'Dafür habe ich noch nicht genug Ernährungsdaten.';
        if (/protein/.test(ql)) return `Im Schnitt der letzten ${avg.days} geloggten Tage isst du **${Utils.round1(avg.protein)} g Protein**.`;
        return `Im Schnitt der letzten ${avg.days} geloggten Tage isst du **${Utils.round(avg.kcal)} kcal**.`;
      }
      // Fallback: Übungsname erkannt -> allgemeine Stats
      const exName = AI.findExerciseInText(ql);
      if (exName) {
        const stats = Training.exerciseStats(exName);
        if (stats) {
          return `**${exName}** — Bestwert (geschätztes 1RM): ${stats.best1rm} kg, max. Gewicht: ${stats.maxWeight} kg, Ø ${stats.avgWeight} kg × ${stats.avgReps} Wdh., Gesamtvolumen: ${Utils.round(stats.totalVolume)} kg über ${stats.sets.length} Sätze.`;
        }
      }
    } catch (e) {
      console.error('AI-Fehler', e);
      return 'Dazu konnte ich leider keine Antwort berechnen — bitte formuliere die Frage anders.';
    }
    return 'Das habe ich leider nicht verstanden. Beispiele: „Passt 100 g Haferflocken noch in meine Ernährung?", „Was kann ich essen, wenn mir noch 40 g Protein fehlen?", „Welche Übung trainiert Rücken?", „Habe ich Beine diese Woche ausreichend trainiert?"';
  },
};

/* ---------------------------------------------------------
   Charts — leichte Canvas-/SVG-Engine, keine externen Libs
--------------------------------------------------------- */
const Charts = {
  setupCanvas(canvas, cssHeight) {
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.parentElement.getBoundingClientRect();
    const cssWidth = Math.max(rect.width, 50);
    const h = cssHeight || Number(canvas.dataset.height) || 200;
    canvas.width = Math.round(cssWidth * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width = cssWidth + 'px';
    canvas.style.height = h + 'px';
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { ctx, w: cssWidth, h };
  },
  roundRect(ctx, x, y, w, h, r) {
    const rr = Math.max(0, Math.min(r, w / 2, h / 2));
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  },
  emptyState(ctx, w, h, msg) {
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.font = '13px -apple-system,sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(msg || 'Noch keine Daten', w / 2, h / 2);
  },
  line(canvas, points, opts = {}) {
    if (!canvas) return;
    const { ctx, w, h } = Charts.setupCanvas(canvas, opts.height);
    ctx.clearRect(0, 0, w, h);
    if (!points || points.length === 0) { Charts.emptyState(ctx, w, h); return; }
    if (points.length === 1) points = [{ ...points[0], label: '' }, points[0]];
    const pad = { l: 40, r: 14, t: 16, b: 22 };
    const ys = points.map(p => p.y);
    let min = opts.yMin ?? Math.min(...ys);
    let max = opts.yMax ?? Math.max(...ys);
    if (min === max) { min -= 1; max += 1; }
    const padY = (max - min) * 0.12;
    min -= padY; max += padY;
    const xStep = (w - pad.l - pad.r) / Math.max(1, points.length - 1);
    const xFor = i => pad.l + i * xStep;
    const yFor = v => h - pad.b - ((v - min) / (max - min)) * (h - pad.t - pad.b);
    ctx.strokeStyle = 'rgba(255,255,255,0.07)'; ctx.lineWidth = 1;
    for (let i = 0; i <= 3; i++) { const gy = pad.t + i * (h - pad.t - pad.b) / 3; ctx.beginPath(); ctx.moveTo(pad.l, gy); ctx.lineTo(w - pad.r, gy); ctx.stroke(); }
    const color = opts.color || '#64d2ff';
    const grad = ctx.createLinearGradient(0, pad.t, 0, h - pad.b);
    grad.addColorStop(0, color + '4D'); grad.addColorStop(1, color + '00');
    ctx.beginPath();
    points.forEach((p, i) => { const x = xFor(i), y = yFor(p.y); i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); });
    ctx.lineTo(xFor(points.length - 1), h - pad.b); ctx.lineTo(xFor(0), h - pad.b); ctx.closePath();
    ctx.fillStyle = grad; ctx.fill();
    ctx.beginPath();
    points.forEach((p, i) => { const x = xFor(i), y = yFor(p.y); i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); });
    ctx.strokeStyle = color; ctx.lineWidth = 2.5; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.stroke();
    if (opts.dots !== false && points.length <= 60) {
      points.forEach((p, i) => { const x = xFor(i), y = yFor(p.y); ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill(); });
    }
    ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.font = '11px -apple-system,sans-serif'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    for (let i = 0; i <= 3; i++) { const val = max - (i * (max - min) / 3); const gy = pad.t + i * (h - pad.t - pad.b) / 3; ctx.fillText(Utils.fmtNum(val, opts.yDecimals || 0), pad.l - 8, gy); }
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = 'rgba(255,255,255,0.45)';
    const labelIdxs = points.length > 1 ? [0, Math.floor((points.length - 1) / 2), points.length - 1] : [0];
    labelIdxs.forEach(i => { if (points[i] && points[i].label) ctx.fillText(points[i].label, xFor(i), h - 4); });
  },
  bar(canvas, bars, opts = {}) {
    if (!canvas) return;
    const { ctx, w, h } = Charts.setupCanvas(canvas, opts.height);
    ctx.clearRect(0, 0, w, h);
    if (!bars || !bars.length) { Charts.emptyState(ctx, w, h); return; }
    const pad = { l: 40, r: 10, t: 16, b: 26 };
    const max = opts.max ?? Math.max(...bars.map(b => b.value), 1);
    const n = bars.length;
    const slot = (w - pad.l - pad.r) / n;
    const barW = Math.min(slot * 0.55, 34);
    ctx.strokeStyle = 'rgba(255,255,255,0.07)'; ctx.lineWidth = 1;
    for (let i = 0; i <= 3; i++) { const gy = pad.t + i * (h - pad.t - pad.b) / 3; ctx.beginPath(); ctx.moveTo(pad.l, gy); ctx.lineTo(w - pad.r, gy); ctx.stroke(); }
    bars.forEach((b, i) => {
      const bh = max > 0 ? (b.value / max) * (h - pad.t - pad.b) : 0;
      const x = pad.l + i * slot + (slot - barW) / 2;
      const y = h - pad.b - bh;
      const c = b.color || opts.color || '#64d2ff';
      const grad = ctx.createLinearGradient(0, y, 0, h - pad.b);
      grad.addColorStop(0, c); grad.addColorStop(1, c + '99');
      ctx.fillStyle = grad;
      Charts.roundRect(ctx, x, y, barW, Math.max(bh, 2), 6);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.font = '10px -apple-system,sans-serif'; ctx.textAlign = 'center';
      if (b.label) ctx.fillText(b.label, x + barW / 2, h - 8);
    });
    ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.font = '11px -apple-system,sans-serif'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    for (let i = 0; i <= 3; i++) { const val = max - (i * max / 3); const gy = pad.t + i * (h - pad.t - pad.b) / 3; ctx.fillText(Utils.fmtNum(val), pad.l - 8, gy); }
  },
  donut(canvas, segments, opts = {}) {
    if (!canvas) return;
    const { ctx, w, h } = Charts.setupCanvas(canvas, opts.height);
    ctx.clearRect(0, 0, w, h);
    const total = segments.reduce((s, x) => s + x.value, 0);
    const cx = w / 2, cy = h / 2, radius = Math.min(w, h) / 2 - 10, stroke = opts.stroke || 18;
    if (total <= 0) { Charts.emptyState(ctx, w, h); return; }
    let start = -Math.PI / 2;
    segments.forEach(seg => {
      const angle = (seg.value / total) * Math.PI * 2;
      ctx.beginPath();
      ctx.arc(cx, cy, radius, start, start + angle);
      ctx.strokeStyle = seg.color; ctx.lineWidth = stroke; ctx.lineCap = 'butt';
      ctx.stroke();
      start += angle;
    });
    if (opts.centerLabel) {
      ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.font = '700 15px -apple-system,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(opts.centerLabel, cx, cy);
    }
  },
  rings(container, ringsData) {
    if (!container) return;
    const size = 176, stroke = 15, center = size / 2;
    let svg = `<svg viewBox="0 0 ${size} ${size}" class="rings-svg" width="${size}" height="${size}">`;
    ringsData.forEach((r, i) => {
      const radius = center - stroke / 2 - i * (stroke + 7);
      const circumference = 2 * Math.PI * radius;
      const pct = Utils.clamp(r.pct || 0, 0, 1);
      const offset = circumference * (1 - pct);
      svg += `<circle cx="${center}" cy="${center}" r="${radius}" stroke="rgba(255,255,255,0.08)" stroke-width="${stroke}" fill="none"></circle>
        <circle cx="${center}" cy="${center}" r="${radius}" stroke="${r.color}" stroke-width="${stroke}" fill="none" stroke-linecap="round" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}" transform="rotate(-90 ${center} ${center})" class="ring-progress"></circle>`;
    });
    svg += `</svg>`;
    container.innerHTML = svg;
  },
  heatmap(container, year) {
    if (!container) return;
    const volByDate = {};
    Store.data.workouts.forEach(w => { if (w.date.startsWith(String(year)) && w.date <= Utils.todayLocal()) volByDate[w.date] = (volByDate[w.date] || 0) + Training.volumeOfWorkout(w); });
    const maxVol = Math.max(1, ...Object.values(volByDate));
    const jan1 = new Date(year, 0, 1);
    const startOffset = (jan1.getDay() + 6) % 7;
    const gridStart = new Date(jan1); gridStart.setDate(gridStart.getDate() - startOffset);
    const days = [];
    let cursor = new Date(gridStart);
    for (let i = 0; i < 380; i++) {
      const iso = Utils.toLocalISODate(cursor);
      days.push(iso);
      cursor.setDate(cursor.getDate() + 1);
      if (cursor.getFullYear() > year && days.length % 7 === 0) break;
    }
    const weeks = [];
    for (let i = 0; i < days.length; i += 7) weeks.push(days.slice(i, i + 7));
    let html = '<div class="heatmap-grid">';
    weeks.forEach(week => {
      html += '<div class="heatmap-col">';
      week.forEach(iso => {
        const inYear = iso.startsWith(String(year));
        const vol = volByDate[iso] || 0;
        let level = 0;
        if (inYear && vol > 0) level = vol < maxVol * 0.25 ? 1 : vol < maxVol * 0.5 ? 2 : vol < maxVol * 0.75 ? 3 : 4;
        const title = inYear ? (Utils.fmtDateHuman(iso) + (vol ? ': ' + Utils.round(vol) + ' kg Volumen' : '')) : '';
        html += `<div class="heatmap-cell lvl${inYear ? level : -1}" title="${Utils.escapeHtml(title)}"></div>`;
      });
      html += '</div>';
    });
    html += '</div>';
    container.innerHTML = html;
  },
};

/* ---------------------------------------------------------
   UI — Toasts, Modals, kleine Helfer
--------------------------------------------------------- */
const UI = {
  toast(msg, type = 'info', duration = 2600) {
    const root = document.getElementById('toastRoot');
    if (!root) return;
    const el = document.createElement('div');
    el.className = `toast toast-${type}`;
    el.textContent = msg;
    root.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));
    setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, duration);
  },
  openModal(html, opts = {}) {
    const root = document.getElementById('modalRoot');
    root.innerHTML = `<div class="modal-backdrop" id="modalBackdrop"><div class="modal-card ${opts.wide ? 'modal-wide' : ''}">${html}</div></div>`;
    root.classList.add('active');
    document.getElementById('modalBackdrop').addEventListener('click', e => { if (e.target.id === 'modalBackdrop' && opts.closable !== false) UI.closeModal(); });
    document.body.style.overflow = 'hidden';
  },
  closeModal() {
    const root = document.getElementById('modalRoot');
    root.classList.remove('active');
    setTimeout(() => { root.innerHTML = ''; }, 200);
    document.body.style.overflow = '';
  },
  confirmDialog(message, onConfirm, confirmLabel) {
    UI.openModal(`
      <div class="modal-header"><h3>Bitte bestätigen</h3></div>
      <div class="modal-body"><p>${Utils.escapeHtml(message)}</p></div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="UI.closeModal()">Abbrechen</button>
        <button class="btn btn-danger" id="confirmBtn">${confirmLabel || 'Löschen'}</button>
      </div>
    `);
    document.getElementById('confirmBtn').addEventListener('click', () => { UI.closeModal(); onConfirm(); });
  },
};

          </div>
        </div>
      </div>

      <div class="grid-dashboard">

        <div class="glass-card stat-card"><div class="stat-label">Kohlenhydrate übrig</div><div class="stat-value">${Utils.round1(Math.max(0, goals.carbs - totals.carbs))}<span class="stat-unit">g</span></div></div>
        <div class="glass-card stat-card"><div class="stat-label">Fett übrig</div><div class="stat-value">${Utils.round1(Math.max(0, goals.fat - totals.fat))}<span class="stat-unit">g</span></div></div>
        <div class="glass-card stat-card"><div class="stat-label">Gewicht</div><div class="stat-value">${latestWeight ? Utils.round1(latestWeight.weight) : '–'}<span class="stat-unit">kg</span></div></div>
        <div class="glass-card stat-card"><div class="stat-label">Volumen (Woche)</div><div class="stat-value">${Utils.round(weekVolume)}<span class="stat-unit">kg</span></div></div>
        <div class="glass-card stat-card"><div class="stat-label">Ernährungs-Score</div><div class="stat-value">${Nutrition.scoreDay(today)}<span class="stat-unit">/100</span></div></div>
      </div>

      <div class="glass-card">
        <div class="card-head"><h3>Gewichtsverlauf</h3><button class="link-btn" onclick="Router.show('body')">Details →</button></div>
        <canvas id="dashWeightChart" data-height="140"></canvas>

      <div class="two-col">
        <div class="glass-card">
          <div class="card-head"><h3>Heutiges Training</h3></div>

        </div>
        <div class="glass-card">
          <div class="card-head"><h3>Letztes &amp; nächstes Training</h3></div>
          <p class="muted-label">Letztes Training</p>
          ${last ? Views.workoutMiniHTML(last) : '<p class="muted">Noch keine Trainings erfasst.</p>'}
          <p class="muted-label" style="margin-top:14px">Nächstes geplantes Training</p>
          ${next ? Views.workoutMiniHTML(next) : '<p class="muted">Kein Training geplant.</p>'}
        </div>
      </div>

      <div class="glass-card">
        <div class="card-head"><h3>Persönliche Rekorde</h3><button class="link-btn" onclick="Router.show('stats')">Alle ansehen →</button></div>
        ${prs.length ? `<div class="pr-list">${prs.map(p => `
          <div class="pr-row">
            <span class="dot" style="background:${groupColor((Store.data.exercises.find(e => e.name === p.name) || {}).group)}"></span>
            <span class="pr-name">${Utils.escapeHtml(p.name)}</span>
            <span class="pr-value">${p.stats.best1rm} kg</span>
          </div>`).join('')}</div>` : '<p class="muted">Noch keine Rekorde — leg los!</p>'}
      </div>
    `;
    Charts.rings(document.getElementById('dashRings'), [
      { pct: totals.kcal / goals.kcal, color: '#ff8a3d' },
      { pct: totals.protein / goals.protein, color: '#21d19f' },
      { pct: totals.water / goals.waterMin, color: '#4da3ff' },
    ]);
    Charts.line(document.getElementById('dashWeightChart'), weightSeries, { color: '#9b6bff', yDecimals: 1 });
  },
};

   Views — Trainings-Formular (Modal) & Trainings-Ansicht

Object.assign(Views, {

  },
  renderWorkoutFormModal() {
    const d = AppState.workoutDraft;
    UI.openModal(`

      <div class="set-card-head"><span class="set-num">Satz ${si + 1}</span><button class="btn-icon-sm" onclick="Views.removeDraftSet(${exIdx},${si})">✕</button></div>

        <div class="set-field"><label>RPE</label><input type="number" step="0.5" min="1" max="10" inputmode="decimal" value="${s.rpe ?? ''}" onchange="Views.updateDraftSet(${exIdx},${si},'rpe',this.value)"></div>
        <div class="set-field"><label>Pause (s)</label><input type="number" inputmode="numeric" value="${s.pause ?? ''}" onchange="Views.updateDraftSet(${exIdx},${si},'pause',this.value)"></div>
      </div>
      <input type="text" class="set-note-input" placeholder="Notiz (optional)" value="${Utils.escapeHtml(s.note || '')}" onchange="Views.updateDraftSet(${exIdx},${si},'note',this.value)">
    </div>`;
  },
  addExerciseToDraft() {
    AppState.workoutDraft.exercises.push({ name: '', group: MUSCLE_GROUPS[0], sets: [] });
    Views.rerenderExercisesInModal();
  },
  removeDraftExercise(idx) { AppState.workoutDraft.exercises.splice(idx, 1); Views.rerenderExercisesInModal(); },
  updateDraftExerciseName(idx, val) { AppState.workoutDraft.exercises[idx].name = val; },
  updateDraftExerciseGroup(idx, val) { AppState.workoutDraft.exercises[idx].group = val; },
  addSetToDraft(exIdx) {
    const sets = AppState.workoutDraft.exercises[exIdx].sets;
    const last = sets[sets.length - 1];
    sets.push(last ? { ...last } : { weight: '', reps: '', rpe: '', pause: '', note: '' });
    Views.rerenderExercisesInModal();
  },
  removeDraftSet(exIdx, si) { AppState.workoutDraft.exercises[exIdx].sets.splice(si, 1); Views.rerenderExercisesInModal(); },
  updateDraftSet(exIdx, si, field, val) { AppState.workoutDraft.exercises[exIdx].sets[si][field] = field === 'note' ? val : (val === '' ? '' : Number(val)); },
  rerenderExercisesInModal() {
    const container = document.getElementById('wfExercises');
    if (container) container.innerHTML = AppState.workoutDraft.exercises.map((ex, i) => Views.exerciseDraftRowHTML(ex, i)).join('') || '<p class="muted">Noch keine Übungen hinzugefügt.</p>';
  },
  saveWorkoutDraft() {
    Views.syncDraftFields();
    const d = AppState.workoutDraft;
    if (!d.name.trim()) d.name = 'Training';
    if (!d.date) { UI.toast('Bitte ein Datum wählen.', 'error'); return; }
    d.exercises = d.exercises.filter(ex => ex.name && ex.name.trim());
    d.exercises.forEach(ex => Training.addExerciseDef(ex.name.trim(), ex.group));
    Training.saveWorkout(d, AppState.editingWorkoutId);
    UI.closeModal();
    UI.toast('Training gespeichert ✓', 'success');
    Router.render();
  },

  /* ---------- Training-Ansicht (Verlauf + Fortschritt) ---------- */
  renderTraining() {

      <div class="page-head"><h1>Training</h1><button class="btn btn-primary" onclick="Views.openWorkoutForm()">+ Neu</button></div>

  renderExerciseProgress() {

    const weightSeries = stats.sets.map(s => ({ x: s.date, y: Number(s.weight) || 0, label: Utils.fmtDateShort(s.date) }));

        <div class="glass-card stat-card"><div class="stat-label">Max. Gewicht</div><div class="stat-value">${stats.maxWeight}<span class="stat-unit">kg</span></div></div>

/* ---------------------------------------------------------
   Views — Ernährung: Tagesübersicht, Mahlzeiten, Lebensmittel
--------------------------------------------------------- */
Object.assign(Views, {
  changeNutritionDate(delta) {
    AppState.nutritionDate = Utils.addDays(AppState.nutritionDate, delta);
    if (AppState.nutritionDate > Utils.todayLocal()) AppState.nutritionDate = Utils.todayLocal();
    Views.renderNutrition();
  },
  progressRowHTML(icon, label, value, min, max, unit, opts = {}) {
    const decimals = opts.decimals ?? 0;
    const fmt = n => Utils.fmtNum(n, decimals);
    const { state } = Nutrition.evaluateGoal(value, min, max, opts.overIsGood);
    let statusText;
    if (state === 'under') statusText = `noch ${fmt(min - value)} ${unit}`;
    else if (state === 'over') statusText = `${fmt(value - max)} ${unit} über Ziel`;
    else statusText = '✓ Ziel erreicht';
    const barDenom = max != null ? Math.max(max, min, 0.0001) : Math.max(min, 0.0001);
    const pct = Utils.clamp((value / barDenom) * 100, value > 0 ? 4 : 0, 100);
    const goalLabel = opts.displayGoal ?? (max != null && max > min ? `${fmt(min)}–${fmt(max)}` : `${fmt(min)}+`);
    const controls = opts.adjustField ? `<span class="progress-row-controls"><button class="btn-icon-sm" onclick="Views.adjustExtra('${opts.adjustField}',${-opts.step})">−</button><button class="btn-icon-sm" onclick="Views.adjustExtra('${opts.adjustField}',${opts.step})">+</button></span>` : '';
    return `<div class="progress-row">
      <div class="progress-row-top">
        <span class="progress-row-label">${icon} ${Utils.escapeHtml(label)}</span>
        <span class="progress-row-value">${fmt(value)} <span class="progress-row-goal">/ ${goalLabel} ${unit}</span></span>
      </div>
      <div class="progress-row-track"><div class="progress-row-fill state-${state}" style="width:${pct}%"></div></div>
      <div class="progress-row-bottom"><span class="progress-row-status status-${state}">${statusText}</span>${controls}</div>
    </div>`;
  },
  adjustExtra(field, delta) {
    const date = AppState.nutritionDate;
    const log = Nutrition.ensureDayLog(date);
    let val = (Number(log[field]) || 0) + delta;
    val = field === 'sleepHours' ? Utils.clamp(val, 0, 16) : Math.max(0, val);
    log[field] = Utils.round1(val);
    Store.save();
    Views.renderNutrition();
  },
  foodItemRowHTML(item, index, mealType) {
    const f = Nutrition.getFood(item.foodId);
    if (!f) return '';
    const m = Nutrition.computeItemMacros(item);
    return `<div class="food-row">
      <div class="food-row-main">
        <div class="food-row-name">${Utils.escapeHtml(f.name)}</div>
        <div class="food-row-amount">
          <input type="number" value="${item.amount}" min="0" step="${f.unit === 'stk' ? 1 : 5}" onchange="Views.updateMealItemAmount('${mealType}',${index},this.value)">
          <span>${f.unit === 'stk' ? 'Stk' : 'g'}</span>
        </div>
      </div>
      <div class="food-row-macros muted">${Utils.round(m.kcal)} kcal · ${Utils.round1(m.protein)}P / ${Utils.round1(m.carbs)}K / ${Utils.round1(m.fat)}F</div>
      <button class="btn-icon-sm" onclick="Views.removeMealItem('${mealType}',${index})">✕</button>
    </div>`;
  },
  updateMealItemAmount(mealType, index, val) { Nutrition.updateItemAmount(AppState.nutritionDate, mealType, index, val); Views.renderNutrition(); },
  removeMealItem(mealType, index) { Nutrition.removeItemFromMeal(AppState.nutritionDate, mealType, index); Views.renderNutrition(); },
  resetMealToTemplate(mealType) { Nutrition.resetToTemplate(AppState.nutritionDate, mealType); Views.renderNutrition(); },
  selectTemplateChoice(mealType, choiceIndex, optionIndex) { Nutrition.selectChoice(mealType, choiceIndex, optionIndex); Views.renderNutrition(); },
  addTemplateMeal(mealType) { Nutrition.addTemplateToDay(AppState.nutritionDate, mealType); Views.renderNutrition(); UI.toast('Hinzugefügt ✓', 'success'); },
  startFreeMeal(mealType) { Nutrition.setMealItems(AppState.nutritionDate, mealType, []); Views.renderNutrition(); Views.openAddFoodModal(mealType); },
  mealSuggestionHTML(mealType, title) {
    const tmpl = Store.data.mealTemplates[mealType];
    const previewTotals = Nutrition.getTemplatePreviewTotals(mealType);
    const fixedNames = (tmpl.items || []).map(it => { const f = Nutrition.getFood(it.foodId); return f ? `${it.amount}${f.unit === 'stk' ? ' Stk' : 'g'} ${f.name}` : ''; }).filter(Boolean);
    const choiceNames = (tmpl.choices || []).map(c => { const sel = c.options[c.selectedIndex]; if (!sel) return ''; return `${sel.amount}g ${sel.label || (Nutrition.getFood(sel.foodId) || {}).name || ''}`; }).filter(Boolean);
    return `<div class="glass-card meal-card meal-suggestion">
      <div class="card-head"><h3>${title}</h3><span class="badge badge-suggestion">Vorschlag</span></div>
      <p class="muted" style="margin-bottom:10px">${Utils.escapeHtml([...fixedNames, ...choiceNames].join(', '))}</p>
      ${(tmpl.choices || []).map((c, ci) => `
        <div class="choice-group">
          <div class="choice-group-label">${Utils.escapeHtml(c.label)}</div>
          <div class="choice-options">
            ${c.options.map((o, oi) => `<button class="choice-chip ${oi === c.selectedIndex ? 'active' : ''}" onclick="Views.selectTemplateChoice('${mealType}',${ci},${oi})">${Utils.escapeHtml(o.label || (Nutrition.getFood(o.foodId) || {}).name || '')}</button>`).join('')}
          </div>
        </div>`).join('')}
      <div class="muted" style="margin:10px 0">${Utils.round(previewTotals.kcal)} kcal · ${Utils.round1(previewTotals.protein)}g P · ${Utils.round1(previewTotals.carbs)}g K · ${Utils.round1(previewTotals.fat)}g F</div>
      <button class="btn btn-primary btn-block" onclick="Views.addTemplateMeal('${mealType}')">+ Hinzufügen</button>
      <button class="link-btn" style="margin-top:8px" onclick="Views.startFreeMeal('${mealType}')">Stattdessen frei zusammenstellen</button>
    </div>`;
  },
  mealSectionAddedHTML(date, mealType, title) {
    const items = Nutrition.getMealItems(date, mealType);
    const totals = Nutrition.sumMacros(items);
    const isTemplateMeal = mealType !== 'dinner';
    return `<div class="glass-card meal-card">
      <div class="card-head">
        <h3>${title}</h3>
        <div class="meal-card-actions">
          ${isTemplateMeal ? `<button class="link-btn" onclick="Views.resetMealToTemplate('${mealType}')">↺ Vorschlag</button>` : ''}
          <button class="btn btn-ghost btn-sm" onclick="Views.openAddFoodModal('${mealType}')">+ Hinzufügen</button>
        </div>
      </div>
      <div class="muted" style="margin-bottom:6px">${Utils.round(totals.kcal)} kcal · ${Utils.round1(totals.protein)}g P · ${Utils.round1(totals.carbs)}g K · ${Utils.round1(totals.fat)}g F</div>
      <div class="food-list">${items.map((it, i) => Views.foodItemRowHTML(it, i, mealType)).join('') || '<p class="muted">Noch nichts hinzugefügt.</p>'}</div>
    </div>`;
  },
  mealSectionHTML(date, mealType, title) {
    if (mealType !== 'dinner' && !Nutrition.isMealAdded(date, mealType)) return Views.mealSuggestionHTML(mealType, title);
    return Views.mealSectionAddedHTML(date, mealType, title);
  },
  renderNutrition() {
    const el = document.getElementById('view-nutrition');
    const date = AppState.nutritionDate;
    const totals = Nutrition.getDayTotals(date);
    const g = Store.data.goals;
    const score = Nutrition.scoreDay(date);
    const isToday = date === Utils.todayLocal();
    const metrics = [
      { value: totals.kcal, min: g.kcal * 0.95, max: g.kcal * 1.05 },
      { value: totals.protein, min: g.protein, max: null, overIsGood: true },
      { value: totals.carbs, min: g.carbsMin, max: g.carbsMax },
      { value: totals.fat, min: g.fat * 0.9, max: g.fat * 1.1 },
      { value: totals.fiber, min: g.fiberMin, max: g.fiberMax },
      { value: totals.salt, min: g.saltMin, max: g.saltMax },
      { value: totals.water, min: g.waterMin, max: null, overIsGood: true },
      { value: totals.fruitServings, min: g.fruitServings, max: null, overIsGood: true },

  openFoodFormModal(id, fromAddFlow) {

          <div class="field"><label>Protein (g)</label><input type="number" step="0.1" id="ffProtein" value="${f.protein}"></div>

          <div class="field"><label>Ballaststoffe (g)</label><input type="number" step="0.1" id="ffFiber" value="${f.fiber || 0}"></div>
          <div class="field"><label>Zucker (g)</label><input type="number" step="0.1" id="ffSugar" value="${f.sugar || 0}"></div>
          <div class="field"><label>Salz (g)</label><input type="number" step="0.1" id="ffSalt" value="${f.salt || 0}"></div>

      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="UI.closeModal()">Abbrechen</button>
        <button class="btn btn-primary" onclick="Views.saveFoodForm()">Speichern</button>
      </div>
    `);
  },
  saveFoodForm() {
    const unit = document.getElementById('ffUnit').value;
    const data = {
      name: document.getElementById('ffName').value.trim() || 'Unbenannt',
      unit, ref: unit === 'stk' ? 1 : 100,
      kcal: Number(document.getElementById('ffKcal').value) || 0,
      protein: Number(document.getElementById('ffProtein').value) || 0,
      carbs: Number(document.getElementById('ffCarbs').value) || 0,
      fat: Number(document.getElementById('ffFat').value) || 0,
      fiber: Number(document.getElementById('ffFiber').value) || 0,
      sugar: Number(document.getElementById('ffSugar').value) || 0,
      salt: Number(document.getElementById('ffSalt').value) || 0,
    };
    let newFood;
    if (AppState.editingFoodId) Nutrition.updateFood(AppState.editingFoodId, data);
    else newFood = Nutrition.addFood(data);
    UI.closeModal();
    UI.toast('Gespeichert ✓', 'success');
    if (AppState.foodFormFromAddFlow && newFood) Views.openAddFoodModal(AppState.addFoodMealType);
    else Router.render();
  },
});

/* ---------------------------------------------------------
   Views — Kalender & Tagesdetail
--------------------------------------------------------- */
Object.assign(Views, {
  workoutDetailStaticHTML(w) {
    const vol = Training.volumeOfWorkout(w);
    return `<div class="glass-card workout-card">
      <div class="workout-card-date">${Utils.fmtDateMed(w.date)}${w.time ? ' · ' + w.time : ''}</div>
      <div class="workout-card-title">${Utils.escapeHtml(w.name)}</div>
      <div class="muted">${(w.exercises || []).length} Übungen · ${Utils.round(vol)} kg Volumen</div>
      <div class="workout-card-body">
        ${(w.exercises || []).map(ex => `
          <div class="exercise-row">
            <div class="exercise-row-head"><span class="dot" style="background:${groupColor(ex.group)}"></span><strong>${Utils.escapeHtml(ex.name)}</strong> <span class="muted">${ex.group}</span></div>
            <div class="set-list">${(ex.sets || []).map((s, i) => `<span class="set-badge">${i + 1}: ${s.weight ?? '–'}kg × ${s.reps ?? '–'}${s.rpe ? ' @' + s.rpe : ''}</span>`).join('') || '<span class="muted">Keine Sätze</span>'}</div>
          </div>`).join('')}
        ${w.notes ? `<div class="workout-notes">📝 ${Utils.escapeHtml(w.notes)}</div>` : ''}
      </div>
      <div class="workout-card-actions" style="margin-top:8px">
        <button class="btn btn-ghost btn-sm" onclick="UI.closeModal();Views.openWorkoutForm('${w.id}')">Bearbeiten</button>
      </div>
    </div>`;
  },
  renderCalendar() {
    const el = document.getElementById('view-calendar');
    const y = AppState.calendarYear, m = AppState.calendarMonth;
    const firstDay = new Date(y, m, 1);
    const startOffset = (firstDay.getDay() + 6) % 7;
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    const prevMonthDays = new Date(y, m, 0).getDate();
    const todayIso = Utils.todayLocal();
    let cells = [];
    for (let i = startOffset - 1; i >= 0; i--) cells.push({ day: prevMonthDays - i, otherMonth: true });
    for (let d = 1; d <= daysInMonth; d++) cells.push({ day: d, otherMonth: false });
    while (cells.length % 7 !== 0) cells.push({ day: cells.length, otherMonth: true });
    el.innerHTML = `
      <div class="page-head"><h1>Kalender</h1></div>
      <div class="glass-card">
        <div class="calendar-nav">
          <button class="btn-icon" onclick="Views.changeCalendarMonth(-1)">←</button>
          <div class="calendar-nav-label" onclick="Views.openMonthYearPicker()">${Utils.monthNamesDe[m]} ${y}</div>
          <button class="btn-icon" onclick="Views.changeCalendarMonth(1)">→</button>
        </div>
        <div class="calendar-weekdays">${Utils.weekdayLettersDe.map(d => `<span>${d}</span>`).join('')}</div>
        <div class="calendar-grid">
          ${cells.map(c => {
            if (c.otherMonth) return `<div class="calendar-cell is-other-month"><span class="calendar-cell-day">${c.day}</span></div>`;
            const iso = `${y}-${String(m + 1).padStart(2, '0')}-${String(c.day).padStart(2, '0')}`;
            const hasWorkout = Training.getWorkoutsOnDate(iso).length > 0;
            const isFuture = iso > todayIso;
            const hasNutrition = !!Store.data.nutritionLogs[iso];
            return `<div class="calendar-cell ${iso === todayIso ? 'is-today' : ''}" onclick="Views.openDayDetail('${iso}')">
              <span class="calendar-cell-day">${c.day}</span>
              <div class="calendar-cell-dots">${hasWorkout ? '<span class="cal-dot cal-dot-workout"></span>' : ''}${hasNutrition && !isFuture ? '<span class="cal-dot cal-dot-food"></span>' : ''}</div>
            </div>`;
          }).join('')}
        </div>
        <div class="legend-row">
          <span class="legend-item"><span class="cal-dot cal-dot-workout"></span> Training</span>
          <span class="legend-item"><span class="cal-dot cal-dot-food"></span> Ernährung geloggt</span>
        </div>
      </div>
    `;
  },
  changeCalendarMonth(delta) {
    AppState.calendarMonth += delta;
    if (AppState.calendarMonth < 0) { AppState.calendarMonth = 11; AppState.calendarYear--; }
    if (AppState.calendarMonth > 11) { AppState.calendarMonth = 0; AppState.calendarYear++; }
    Views.renderCalendar();
  },
  openMonthYearPicker() {
    UI.openModal(`
      <div class="modal-header"><h3>Monat wählen</h3><button class="btn-icon" onclick="UI.closeModal()">✕</button></div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="field"><label>Monat</label><select id="pickMonth">${Utils.monthNamesDe.map((mn, i) => `<option value="${i}" ${i === AppState.calendarMonth ? 'selected' : ''}>${mn}</option>`).join('')}</select></div>
          <div class="field"><label>Jahr</label><input type="number" id="pickYear" value="${AppState.calendarYear}"></div>
        </div>
      </div>
      <div class="modal-footer"><button class="btn btn-ghost" onclick="UI.closeModal()">Abbrechen</button><button class="btn btn-primary" onclick="Views.applyMonthYearPick()">Ansehen</button></div>
    `);
  },
  applyMonthYearPick() {
    AppState.calendarMonth = Number(document.getElementById('pickMonth').value);
    AppState.calendarYear = Number(document.getElementById('pickYear').value);
    UI.closeModal();
    Views.renderCalendar();
  },
  openDayDetail(iso) {
    const workouts = Training.getWorkoutsOnDate(iso);
    const isFuture = iso > Utils.todayLocal();
    const totals = !isFuture ? Nutrition.getDayTotals(iso) : null;
    UI.openModal(`
      <div class="modal-header"><h3>${Utils.fmtDateHuman(iso)}</h3><button class="btn-icon" onclick="UI.closeModal()">✕</button></div>
      <div class="modal-body">
        <div class="card-head"><h4>Training</h4><button class="link-btn" onclick="Views.quickAddWorkoutOnDate('${iso}')">+ Hinzufügen</button></div>
        ${workouts.length ? workouts.map(w => Views.workoutDetailStaticHTML(w)).join('') : '<p class="muted">Kein Training an diesem Tag.</p>'}
        ${totals ? `<div class="card-head" style="margin-top:14px"><h4>Ernährung</h4></div>
          <div class="muted">${Utils.round(totals.kcal)} kcal · ${Utils.round1(totals.protein)}g Protein · ${Utils.round1(totals.carbs)}g Kohlenhydrate · ${Utils.round1(totals.fat)}g Fett</div>
          <button class="link-btn" onclick="Views.jumpToNutritionDate('${iso}')">Details ansehen →</button>` : ''}
      </div>
    `, { wide: true });
  },
  quickAddWorkoutOnDate(iso) {
    UI.closeModal();
    Views.openWorkoutForm(null);
    setTimeout(() => { const inp = document.getElementById('wfDate'); if (inp) { inp.value = iso; Views.syncDraftFields(); } }, 60);
  },
  jumpToNutritionDate(iso) { UI.closeModal(); AppState.nutritionDate = iso; Router.show('nutrition'); },

  /* ---------- Körperdaten ---------- */
  renderBody() {

/* ---------------------------------------------------------
   Views — Statistik

Object.assign(Views, {
  renderStats() {
    const el = document.getElementById('view-stats');
    const today = Utils.todayLocal();
    const weekStart = Utils.startOfWeek(today);
    const monthStart = Utils.startOfMonth(today);
    const yearStart = `${today.slice(0, 4)}-01-01`;
    const totalWorkouts = Training.workoutsUpToToday().length;
    const weekCount = Training.workoutsInRange(weekStart, today).length;
    const monthCount = Training.workoutsInRange(monthStart, today).length;
    const yearCount = Training.workoutsInRange(yearStart, today).length;
    const withDur = Training.workoutsUpToToday().filter(w => w.duration);
    const avgDuration = withDur.length ? Utils.round(withDur.reduce((s, w) => s + Number(w.duration), 0) / withDur.length) : null;

    const weeklyVolume = [];
    for (let i = 11; i >= 0; i--) {
      const wkStart = Utils.addDays(weekStart, -7 * i);
      const wkEnd = Utils.addDays(wkStart, 6);
      const ws = Training.workoutsInRange(wkStart, wkEnd);
      weeklyVolume.push({ label: Utils.fmtDateShort(wkStart), value: ws.reduce((s, w) => s + Training.volumeOfWorkout(w), 0) });
    }
    const groupRange = AppState.statsGroupRange;
    const sinceDate = groupRange ? Utils.addDays(today, -groupRange) : null;
    const groupVol = Training.volumeByMuscleGroup(sinceDate);
    const groupBars = MUSCLE_GROUPS.map(g => ({ label: g.slice(0, 3), value: groupVol[g] || 0, color: groupColor(g) })).sort((a, b) => b.value - a.value);
    const prs = Training.allPRs();
    const weightSeries = BodyData.series('weight').map(p => ({ ...p, label: Utils.fmtDateShort(p.x) }));
    const kcalSeries = [], proteinSeries = [];
    for (let i = 29; i >= 0; i--) {
      const d = Utils.addDays(today, -i);
      const t = Nutrition.getDayTotals(d);
      kcalSeries.push({ x: d, y: t.kcal, label: i % 6 === 0 ? Utils.fmtDateShort(d) : '' });
      proteinSeries.push({ x: d, y: t.protein, label: i % 6 === 0 ? Utils.fmtDateShort(d) : '' });
    }
    const avg7 = Nutrition.avgOverDays(7);
    const fastest = Training.fastestImproving();

    el.innerHTML = `
      <div class="page-head"><h1>Statistik</h1></div>
      <div class="grid-dashboard">
        <div class="glass-card stat-card"><div class="stat-label">Trainings gesamt</div><div class="stat-value">${totalWorkouts}</div></div>
        <div class="glass-card stat-card"><div class="stat-label">Diese Woche</div><div class="stat-value">${weekCount}</div></div>
        <div class="glass-card stat-card"><div class="stat-label">Dieser Monat</div><div class="stat-value">${monthCount}</div></div>
        <div class="glass-card stat-card"><div class="stat-label">Dieses Jahr</div><div class="stat-value">${yearCount}</div></div>
        <div class="glass-card stat-card"><div class="stat-label">Ø Dauer</div><div class="stat-value">${avgDuration ?? '–'}<span class="stat-unit">Min</span></div></div>
        <div class="glass-card stat-card"><div class="stat-label">Serie</div><div class="stat-value">${Training.streak()}<span class="stat-unit">Tage</span></div></div>
      </div>
      <div class="glass-card"><div class="card-head"><h3>Trainingsvolumen (12 Wochen)</h3></div><canvas id="statsVolumeChart" data-height="160"></canvas></div>
      <div class="glass-card">
        <div class="card-head"><h3>Volumen pro Muskelgruppe</h3>
          <select id="statsGroupRangeSelect">
            <option value="30" ${groupRange === 30 ? 'selected' : ''}>30 Tage</option>
            <option value="90" ${groupRange === 90 ? 'selected' : ''}>90 Tage</option>
            <option value="0" ${!groupRange ? 'selected' : ''}>Gesamt</option>
          </select>
        </div>
        <canvas id="statsGroupChart" data-height="160"></canvas>
      </div>
      ${fastest ? `<div class="glass-card"><div class="card-head"><h3>Am schnellsten verbessert</h3></div><p>${Utils.escapeHtml(fastest.name)}: ${Utils.round1(fastest.firstE1)} kg → ${Utils.round1(fastest.lastE1)} kg geschätztes 1RM (<strong style="color:${fastest.pct >= 0 ? '#21d19f' : '#ff5a4e'}">${fastest.pct >= 0 ? '+' : ''}${Utils.round1(fastest.pct)}%</strong>)</p></div>` : ''}
      <div class="glass-card">
        <div class="card-head"><h3>Persönliche Rekorde</h3></div>
        ${prs.length ? `<div class="pr-list">${prs.map(p => `<div class="pr-row"><span class="dot" style="background:${groupColor((Store.data.exercises.find(e => e.name === p.name) || {}).group)}"></span><span class="pr-name">${Utils.escapeHtml(p.name)}</span><span class="pr-value">${p.stats.best1rm} kg</span></div>`).join('')}</div>` : '<p class="muted">Noch keine Daten.</p>'}
      </div>
      <div class="glass-card"><div class="card-head"><h3>Gewichtsentwicklung</h3></div><canvas id="statsWeightChart" data-height="140"></canvas></div>
      <div class="glass-card"><div class="card-head"><h3>Kalorien (30 Tage)</h3></div><canvas id="statsKcalChart" data-height="140"></canvas></div>
      <div class="glass-card"><div class="card-head"><h3>Protein (30 Tage)</h3></div><canvas id="statsProteinChart" data-height="140"></canvas></div>
      <div class="glass-card">
        <div class="card-head"><h3>Ø Makroverteilung (7 Tage)</h3></div>
        ${avg7 ? `<div class="donut-row"><div class="donut-chart-wrap"><canvas id="statsMacroDonut" data-height="140"></canvas></div>
          <div class="rings-legend">
            <div class="legend-item"><span class="dot" style="background:#21d19f"></span>Protein ${Utils.round1(avg7.protein)}g</div>
            <div class="legend-item"><span class="dot" style="background:#ffc24b"></span>Kohlenhydrate ${Utils.round1(avg7.carbs)}g</div>
            <div class="legend-item"><span class="dot" style="background:#ff5a4e"></span>Fett ${Utils.round1(avg7.fat)}g</div>
          </div></div>` : '<p class="muted">Noch keine Ernährungsdaten.</p>'}
      </div>
      <div class="glass-card">
        <div class="card-head"><h3>Trainings-Heatmap ${AppState.heatmapYear}</h3><div><button class="btn-icon" onclick="Views.changeHeatmapYear(-1)">←</button><button class="btn-icon" onclick="Views.changeHeatmapYear(1)">→</button></div></div>
        <div id="statsHeatmap"></div>
      </div>
    `;
    Charts.bar(document.getElementById('statsVolumeChart'), weeklyVolume, { color: '#4da3ff' });
    Charts.bar(document.getElementById('statsGroupChart'), groupBars, {});
    Charts.line(document.getElementById('statsWeightChart'), weightSeries, { color: '#9b6bff', yDecimals: 1 });
    Charts.line(document.getElementById('statsKcalChart'), kcalSeries, { color: '#ff8a3d' });
    Charts.line(document.getElementById('statsProteinChart'), proteinSeries, { color: '#21d19f' });
    if (avg7) Charts.donut(document.getElementById('statsMacroDonut'), [{ value: avg7.protein * 4, color: '#21d19f' }, { value: avg7.carbs * 4, color: '#ffc24b' }, { value: avg7.fat * 9, color: '#ff5a4e' }], {});
    Charts.heatmap(document.getElementById('statsHeatmap'), AppState.heatmapYear);
    document.getElementById('statsGroupRangeSelect').addEventListener('change', function () { AppState.statsGroupRange = this.value === '0' ? null : Number(this.value); Views.renderStats(); });
  },
  changeHeatmapYear(delta) { AppState.heatmapYear += delta; Views.renderStats(); },

  /* ---------- Suche ---------- */
  renderSearch() {
    const el = document.getElementById('view-search');
    el.innerHTML = `
      <button class="btn btn-ghost" onclick="Router.show('more')">← Zurück</button>
      <div class="page-head"><h1>Suche</h1></div>
      <div class="glass-card">
        <div class="form-grid">
          <div class="field"><label>Text (Name/Notiz)</label><input type="text" id="searchText"></div>
          <div class="field"><label>Übung</label><input type="text" id="searchExercise" list="exerciseNamesListSearch"><datalist id="exerciseNamesListSearch">${Views.exerciseOptionsHTML()}</datalist></div>
          <div class="field"><label>Muskelgruppe</label><select id="searchGroup"><option value="">Alle</option>${MUSCLE_GROUPS.map(g => `<option value="${g}">${g}</option>`).join('')}</select></div>
          <div class="field"><label>Von</label><input type="date" id="searchFrom"></div>
          <div class="field"><label>Bis</label><input type="date" id="searchTo"></div>
          <div class="field"><label>Min. Gewicht (kg)</label><input type="number" id="searchMinWeight"></div>
        </div>
        <button class="btn btn-primary btn-block" onclick="Views.runSearch()">Suchen</button>
      </div>
      <div id="searchResults"></div>
    `;
  },
  runSearch() {
    const filters = {
      text: document.getElementById('searchText').value, exercise: document.getElementById('searchExercise').value,
      group: document.getElementById('searchGroup').value, dateFrom: document.getElementById('searchFrom').value,
      dateTo: document.getElementById('searchTo').value, minWeight: document.getElementById('searchMinWeight').value,
    };
    const results = Search.run(filters);
    document.getElementById('searchResults').innerHTML = `<h3 class="section-title">${results.length} Treffer</h3>` + (results.map(w => Views.workoutCardHTML(w, w.date > Utils.todayLocal())).join('') || '<p class="muted">Keine Trainings gefunden.</p>');
  },

  /* ---------- Lokaler Coach (KI) ---------- */
  renderAI() {
    const el = document.getElementById('view-ai');
    el.innerHTML = `
      <button class="btn btn-ghost" onclick="Router.show('more')">← Zurück</button>
      <div class="page-head"><h1>Lokaler Coach</h1></div>
      <p class="muted">Wertet ausschließlich deine lokal gespeicherten Daten aus — komplett offline, ohne Cloud.</p>
      <div class="ai-suggestions">
        ${['Kalorien übrig', 'Protein übrig', 'Trainingsvolumen letzte Woche', 'Muskelgruppe am wenigsten trainiert', 'Trainingseinheiten diesen Monat'].map(q => `<button class="ai-chip" onclick="Views.askAIChip('${q}')">${q}</button>`).join('')}
      </div>
      <div class="glass-card ai-chat" id="aiChat">${AI.history.length ? AI.history.map(h => Views.aiMessageHTML(h)).join('') : '<p class="muted">Stell mir eine Frage zu deinem Training oder deiner Ernährung.</p>'}</div>
      <div class="ai-input-row"><input type="text" id="aiInput" placeholder="Frage stellen…"><button class="btn btn-primary" onclick="Views.submitAIQuestion()">Senden</button></div>
    `;
    document.getElementById('aiInput').addEventListener('keydown', e => { if (e.key === 'Enter') Views.submitAIQuestion(); });
    const chat = document.getElementById('aiChat');
    chat.scrollTop = chat.scrollHeight;
  },
  aiMessageHTML(h) { return `<div class="ai-message ai-message-${h.role}">${h.role === 'user' ? Utils.escapeHtml(h.text) : Views.mdLiteToHtml(h.text)}</div>`; },
  mdLiteToHtml(text) { return Utils.escapeHtml(text).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>'); },
  askAIChip(label) {
    const map = {
      'Kalorien übrig': 'Wie viele Kalorien habe ich heute noch übrig?',
      'Protein übrig': 'Wie viel Protein fehlt mir noch?',
      'Trainingsvolumen letzte Woche': 'Wie hoch war mein Trainingsvolumen letzte Woche?',
      'Muskelgruppe am wenigsten trainiert': 'Welche Muskelgruppe trainiere ich am wenigsten?',
      'Trainingseinheiten diesen Monat': 'Wie viele Trainingseinheiten hatte ich diesen Monat?',
    };
    document.getElementById('aiInput').value = map[label] || label;
    Views.submitAIQuestion();
  },
  submitAIQuestion() {
    const input = document.getElementById('aiInput');
    const q = input.value.trim();
    if (!q) return;
    AI.history.push({ role: 'user', text: q });
    const answer = AI.ask(q);
    AI.history.push({ role: 'ai', text: answer });
    input.value = '';
    Views.renderAI();
  },

  /* ---------- Mehr / Menü ---------- */
  renderMore() {
    const el = document.getElementById('view-more');
    el.innerHTML = `
      <div class="page-head"><h1>Mehr</h1></div>
      <div class="more-grid">
        <div class="glass-card more-item" onclick="Router.show('stats')"><div class="more-icon">📊</div><div>Statistik</div></div>
        <div class="glass-card more-item" onclick="Router.show('body')"><div class="more-icon">📏</div><div>Körperdaten</div></div>
        <div class="glass-card more-item" onclick="Router.show('search')"><div class="more-icon">🔍</div><div>Suche</div></div>
        <div class="glass-card more-item" onclick="Router.show('ai')"><div class="more-icon">🤖</div><div>Lokaler Coach</div></div>
        <div class="glass-card more-item" onclick="Router.show('goals')"><div class="more-icon">🎯</div><div>Ziele</div></div>
        <div class="glass-card more-item" onclick="Router.show('foods')"><div class="more-icon">🥗</div><div>Lebensmittel</div></div>
      </div>
      <div class="glass-card">
        <div class="card-head"><h3>Speicher-Status</h3><button class="btn btn-ghost btn-sm" onclick="Views.runStorageDiagnostic()">Jetzt testen</button></div>
        <div id="storageDiagSection"></div>
      </div>
      <div class="glass-card">
        <div class="card-head"><h3>Cloud-Sync <span class="muted" style="font-weight:600">(optional)</span></h3></div>
        <div id="syncStatusSection"></div>
      </div>
      <div class="glass-card">
        <div class="card-head"><h3>Daten</h3></div>
        <button class="btn btn-ghost btn-block" onclick="ExportImport.exportJSON()">⬇️ Backup exportieren (JSON)</button>
        <button class="btn btn-ghost btn-block" onclick="ExportImport.exportWorkoutsCSV()">⬇️ Trainings exportieren (CSV)</button>
        <label class="btn btn-ghost btn-block" style="text-align:center;cursor:pointer;display:block">⬆️ Backup importieren (JSON)
          <input type="file" accept="application/json" id="importFileInput" style="display:none">
        </label>
        <p class="hint">Exportiere regelmäßig ein Backup — deine Daten liegen primär in diesem Browser.</p>
      </div>
      <div class="glass-card"><div class="muted">FORMA · lokal-first, Cloud-Sync optional · keine Pflicht-Anmeldung</div></div>
    `;
    document.getElementById('importFileInput').addEventListener('change', function () {
      if (this.files && this.files[0]) {
        const file = this.files[0];
        UI.confirmDialog('Import überschreibt alle aktuell gespeicherten Daten in dieser App. Fortfahren?', () => { ExportImport.importJSON(file, () => Router.show('dashboard')); }, 'Importieren');
      }
    });
    Views.renderSyncSection();
    Views.renderStorageDiagnostic();
  },
  renderStorageDiagnostic() {
    const container = document.getElementById('storageDiagSection');
    if (!container) return;
    const d = Store.getDiagnostics();
    container.innerHTML = `
      <div class="sync-status-row"><span class="sync-status-dot ${d.writable ? 'ok' : 'error'}"></span>${d.writable ? 'Lokaler Speicher funktioniert' : 'Lokaler Speicher NICHT verfügbar'}</div>
      <p class="hint" style="margin-top:0">${d.writable
        ? `Aktuell ${d.sizeKB} KB gespeichert. Tipp: Öffne diese Seite jetzt neu (F5 / Wisch nach unten) und schau danach hier erneut vorbei — steht wieder „funktioniert", hat das Speichern geklappt.`
        : `Grund meist: privater/inkognito Modus, oder der Browser blockiert Website-Speicher. ${d.error ? 'Fehlermeldung: ' + Utils.escapeHtml(d.error) : ''} Bitte in einem normalen (nicht-privaten) Browser-Tab öffnen.`}</p>
    `;
  },
  runStorageDiagnostic() { Views.renderStorageDiagnostic(); UI.toast('Speichertest durchgeführt', 'success', 1500); },
  renderSyncSection() {
    const container = document.getElementById('syncStatusSection');
    if (!container) return;
    if (!Sync.code) {
      container.innerHTML = `
        <p class="muted" style="margin-bottom:10px">Sichere deine Daten zusätzlich in der Cloud, um sie auf mehreren Geräten zu nutzen. Ohne Code läuft alles ausschließlich lokal in diesem Browser.</p>
        <button class="btn btn-ghost btn-block" onclick="Views.setupNewSyncCode()">Neuen Sync-Code erstellen</button>
        <button class="btn btn-ghost btn-block" onclick="Views.openEnterSyncCodeModal()">Vorhandenen Code eingeben</button>
      `;
    } else {
      const statusText = { idle: 'Noch nicht synchronisiert', syncing: 'Synchronisiere…', ok: 'Synchronisiert', error: 'Fehler bei der Synchronisierung' }[Sync.status] || 'Unbekannt';
      container.innerHTML = `
        <div class="sync-status-row"><span class="sync-status-dot ${Sync.status}"></span>${statusText}${Sync.lastSyncAt ? ' · ' + Sync.lastSyncAt.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) : ''}</div>
        <div class="sync-code-display">${Utils.escapeHtml(Sync.code)}</div>
        <p class="hint" style="margin-top:0">Gib diesen Code auf einem anderen Gerät ein, um dieselben Daten dort zu laden. Wer den Code kennt, hat Zugriff — behandle ihn wie ein Passwort.</p>
        <button class="btn btn-ghost btn-block" onclick="Views.backupNowClicked()">Jetzt sichern</button>
        <button class="btn btn-ghost btn-block" onclick="Views.confirmRestore()">Von Cloud wiederherstellen</button>
        <button class="btn btn-ghost btn-block" onclick="Views.confirmDisconnectSync()">Trennen</button>
      `;
    }
  },
  setupNewSyncCode() {
    Sync.setCode(Sync.generateCode());
    Sync.push();
    Views.renderSyncSection();
    UI.toast('Sync-Code erstellt ✓', 'success');
  },
  openEnterSyncCodeModal() {
    UI.openModal(`
      <div class="modal-header"><h3>Sync-Code eingeben</h3><button class="btn-icon" onclick="UI.closeModal()">✕</button></div>
      <div class="modal-body">
        <div class="field"><label>Code</label><input type="text" id="syncCodeInput" placeholder="XXXX-XXXX-XXXX" style="text-transform:uppercase"></div>
        <p class="hint">Übernimm den Code von einem Gerät, auf dem bereits synchronisiert wird.</p>
      </div>
      <div class="modal-footer"><button class="btn btn-ghost" onclick="UI.closeModal()">Abbrechen</button><button class="btn btn-primary" onclick="Views.confirmEnterSyncCode()">Verbinden &amp; laden</button></div>
    `);
  },
  confirmEnterSyncCode() {
    const code = document.getElementById('syncCodeInput').value.trim();
    if (!code) return;
    Sync.setCode(code);
    UI.closeModal();
    Sync.pull().then(remote => {
      if (remote) {
        UI.confirmDialog('Cloud-Daten für diesen Code gefunden. Lokale Daten auf diesem Gerät durch die Cloud-Version ersetzen?', () => {
          Store.data = Store.migrate(remote);
          Store.save({ skipSync: true });
          Router.render();
          UI.toast('Daten übernommen ✓', 'success');
        });
      } else {
        UI.toast('Kein Backup für diesen Code gefunden — deine aktuellen Daten werden ab jetzt dorthin gesichert.', 'info', 4000);
        Sync.push();
      }
      Views.renderSyncSection();
    });
  },
  backupNowClicked() { Sync.manualBackupNow().then(() => Views.renderSyncSection()); },
  confirmRestore() {
    UI.confirmDialog('Aktuelle lokale Daten auf diesem Gerät durch den letzten Cloud-Stand ersetzen? Nicht gesicherte lokale Änderungen gehen dabei verloren.', async () => { await Sync.manualRestore(); Views.renderSyncSection(); });
  },
  confirmDisconnectSync() {
    UI.confirmDialog('Cloud-Sync auf diesem Gerät trennen? Deine lokalen Daten bleiben erhalten, es wird nur nichts mehr automatisch hochgeladen.', () => { Sync.clearCode(); Views.renderSyncSection(); UI.toast('Getrennt', 'success'); });
  },
  updateSyncStatusUI() { if (Router.current === 'more') Views.renderSyncSection(); },

          <div class="field"><label>Schlaf min (h)</label><input type="number" step="0.5" id="goalSleepMin" value="${g.sleepMin}"></div>

        <button class="btn btn-primary btn-block" onclick="Views.saveGoals()">Speichern</button>
        <p class="hint">Der Ernährungs-Score (0–100) gewichtet: Kalorien 20, Protein 20, Kohlenhydrate 10, Fett 10, Ballaststoffe 15, Salz 10, Wasser 10, Obst 2,5, Gemüse 2,5 Punkte.</p>

  saveGoals() {
    const num = id => Number(document.getElementById(id).value) || 0;
    Object.assign(Store.data.goals, {
      kcal: num('goalKcal'), protein: num('goalProtein'), fat: num('goalFat'), carbs: num('goalCarbs'),
      carbsMin: num('goalCarbsMin'), carbsMax: num('goalCarbsMax'), fiberMin: num('goalFiberMin'), fiberMax: num('goalFiberMax'),
      saltMin: num('goalSaltMin'), saltMax: num('goalSaltMax'),
      waterMin: num('goalWaterMin'), waterMax: num('goalWaterMax'), fruitServings: num('goalFruit'),
      vegMin: num('goalVegMin'), vegMax: num('goalVegMax'), sleepMin: num('goalSleepMin'), sleepMax: num('goalSleepMax'),
    });
    Store.save();
    UI.toast('Ziele gespeichert ✓', 'success');
    Router.show('nutrition');
  },
});

/* ---------------------------------------------------------
   Bootstrap
--------------------------------------------------------- */
function initApp() {
  AppState.storageOk = Store.testStorageWritable();
  Store.load();
  AppState.nutritionDate = Utils.todayLocal();
  document.querySelectorAll('.nav-item').forEach(btn => btn.addEventListener('click', () => Router.show(btn.dataset.view)));
  Router.show('dashboard');
  Sync.init();
  window.addEventListener('error', e => { console.error('Unerwarteter Fehler', e.error || e.message); UI.toast('Ein unerwarteter Fehler ist aufgetreten.', 'error'); });
  window.addEventListener('unhandledrejection', e => { console.error('Unerwarteter Fehler (Promise)', e.reason); UI.toast('Ein unerwarteter Fehler ist aufgetreten.', 'error'); });
  // Sicherheitsnetz: zusätzlicher Speicherversuch beim Verlassen/Verbergen der Seite
  window.addEventListener('pagehide', () => Store.flushNow());
  window.addEventListener('beforeunload', () => Store.flushNow());
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') Store.flushNow(); });
}
document.addEventListener('DOMContentLoaded', initApp);

</script>
</body>
</html>
