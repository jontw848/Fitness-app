<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05060a">
<title>FORMA — Fitness &amp; Ernährung</title>
<style>
/* ============================================================
   FORMA — Stylesheet (Teil 1/2)
   ============================================================ */
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }

:root {
  --bg-0: #05060a;
  --glass-bg: rgba(255,255,255,0.055);
  --glass-bg-strong: rgba(255,255,255,0.095);
  --glass-border: rgba(255,255,255,0.09);
  --text-1: #f5f6f8;
  --text-2: #9a9ca6;
  --text-3: #6b6d78;
  --coral: #ff5a4e;
  --coral-2: #ff8a3d;
  --teal: #21d19f;
  --teal-2: #63e6a0;
  --blue: #4da3ff;
  --violet: #9b6bff;
  --amber: #ffc24b;
  --pink: #ff6fa8;
  --danger: #ff5a4e;
  --success: #21d19f;
  --r-lg: 26px;
  --r-md: 18px;
  --r-sm: 12px;
  --shadow-1: 0 10px 34px rgba(0,0,0,0.42);
  --ease: cubic-bezier(.4,0,.2,1);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

body {
  font-family: var(--font);
  background:
    radial-gradient(circle at 18% -6%, #171b34 0%, transparent 42%),
    radial-gradient(circle at 108% 100%, #0d2323 0%, transparent 45%),
    var(--bg-0);
  color: var(--text-1);
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}
h1,h2,h3,h4 { font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; }
h1 { font-size: 26px; }
h3 { font-size: 16px; }
h4 { font-size: 14px; }
p { line-height: 1.5; }
button, input, select, textarea { font-family: inherit; color: inherit; }
a { color: var(--blue); }

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 8px; }

.hidden { display: none !important; }
.muted { color: var(--text-2); font-size: 13px; }
.muted-label { color: var(--text-3); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; margin-bottom: 4px; }
.eyebrow { color: var(--text-2); font-size: 13px; font-weight: 600; text-transform: capitalize; }
.hint { color: var(--text-3); font-size: 12px; margin-top: 10px; line-height: 1.5; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: middle; flex-shrink: 0; }
.section-title { font-size: 13px; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; margin: 22px 0 10px; }

/* ---------- App shell / layout ---------- */
#app { display: flex; min-height: 100vh; min-height: 100dvh; }

#sideNav { display: none; }

#mainContent {
  flex: 1;
  max-width: 720px;
  margin: 0 auto;
  width: 100%;
  padding: 20px 16px calc(96px + env(safe-area-inset-bottom)) 16px;
  min-height: 100vh;
}

#bottomNav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  display: flex; justify-content: space-around;
  padding: 8px 6px calc(8px + env(safe-area-inset-bottom));
  background: rgba(12,13,20,0.72);
  backdrop-filter: blur(24px) saturate(160%);
  -webkit-backdrop-filter: blur(24px) saturate(160%);
  border-top: 1px solid var(--glass-border);
}
.nav-item {
  background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 3px;
  color: var(--text-3); font-size: 10.5px; font-weight: 600; padding: 6px 10px; border-radius: 14px;
  transition: color 180ms var(--ease), background 180ms var(--ease); cursor: pointer; flex: 1; max-width: 84px;
}
.nav-icon { font-size: 20px; line-height: 1; }
.nav-item.active { color: var(--text-1); background: rgba(255,255,255,0.06); }

/* ---------- Page head ---------- */
.page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 16px; }
.page-head h1 { margin-top: 2px; }
.streak-chip { background: var(--glass-bg-strong); border: 1px solid var(--glass-border); border-radius: 999px; padding: 8px 14px; font-weight: 800; font-size: 14px; }

/* ---------- Cards ---------- */
.glass-card {
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-1);
  backdrop-filter: blur(22px) saturate(160%);
  -webkit-backdrop-filter: blur(22px) saturate(160%);
  padding: 18px;
  margin-bottom: 14px;
  animation: fadeSlideIn 360ms var(--ease);
  position: relative;
}
.glass-card::before {
  content: ""; position: absolute; inset: 0; border-radius: var(--r-lg); pointer-events: none;
  background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0) 40%);
}
.hero-card { padding: 22px 18px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.card-head h3 { flex: 1; }
.two-col { display: grid; grid-template-columns: 1fr; gap: 14px; }

@keyframes fadeSlideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

/* ---------- Buttons ---------- */
.btn {
  font-weight: 700; font-size: 14px; border-radius: 14px; padding: 11px 18px; border: none; cursor: pointer;
  transition: transform 120ms var(--ease), filter 160ms var(--ease), background 160ms var(--ease); white-space: nowrap;
}
.btn:active { transform: scale(0.97); }
.btn-primary { background: linear-gradient(135deg, var(--coral-2), var(--coral)); color: #fff; box-shadow: 0 6px 18px rgba(255,90,78,0.32); }
.btn-primary:hover { filter: brightness(1.08); }
.btn-ghost { background: var(--glass-bg-strong); color: var(--text-1); border: 1px solid var(--glass-border); }
.btn-danger { background: linear-gradient(135deg, #ff6a5e, var(--danger)); color: #fff; }
.btn-block { width: 100%; margin-top: 8px; }
.btn-sm { padding: 7px 12px; font-size: 12.5px; border-radius: 11px; }
.btn-icon, .btn-icon-sm { background: var(--glass-bg-strong); border: 1px solid var(--glass-border); border-radius: 50%; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.btn-icon { width: 38px; height: 38px; font-size: 15px; }
.btn-icon-sm { width: 26px; height: 26px; font-size: 12px; }
.link-btn { background: none; border: none; color: var(--blue); font-weight: 700; font-size: 13px; cursor: pointer; padding: 4px 0; }

.segmented { display: flex; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 14px; padding: 4px; margin-bottom: 14px; }
.seg-btn { flex: 1; background: none; border: none; padding: 9px; border-radius: 10px; color: var(--text-2); font-weight: 700; font-size: 13px; cursor: pointer; transition: all 160ms var(--ease); }
.seg-btn.active { background: var(--glass-bg-strong); color: var(--text-1); box-shadow: 0 2px 8px rgba(0,0,0,0.3); }

/* ---------- Forms ---------- */
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.field label { font-size: 12px; color: var(--text-2); font-weight: 700; }
input, select, textarea {
  background: rgba(255,255,255,0.045); border: 1px solid var(--glass-border); border-radius: 12px;
  padding: 11px 12px; font-size: 15px; color: var(--text-1); width: 100%; outline: none;
  transition: border-color 160ms var(--ease), background 160ms var(--ease);
}
input:focus, select:focus, textarea:focus { border-color: var(--blue); background: rgba(255,255,255,0.07); }
textarea { resize: vertical; font-family: inherit; }
select { -webkit-appearance: none; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--text-2) 50%), linear-gradient(135deg, var(--text-2) 50%, transparent 50%); background-position: calc(100% - 16px) center, calc(100% - 11px) center; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; padding-right: 30px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
input[type="date"], input[type="time"] { color-scheme: dark; }

/* ---------- Modal ---------- */
#modalRoot { position: fixed; inset: 0; z-index: 100; pointer-events: none; }
#modalRoot.active { pointer-events: auto; }
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(3,4,8,0.6); backdrop-filter: blur(6px);
  display: flex; align-items: flex-end; justify-content: center; opacity: 0; animation: fadeIn 220ms var(--ease) forwards;
}
@keyframes fadeIn { to { opacity: 1; } }
.modal-card {
  background: #14151d; border: 1px solid var(--glass-border); border-radius: 26px 26px 0 0;
  width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; padding: 20px;
  transform: translateY(30px); animation: modalUp 260ms var(--ease) forwards;
  padding-bottom: calc(20px + env(safe-area-inset-bottom));
}
@keyframes modalUp { to { transform: translateY(0); } }
@media (min-width: 620px) {
  .modal-backdrop { align-items: center; }
  .modal-card { border-radius: 24px; }
}
.modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; position: sticky; top: 0; }
.modal-body p { color: var(--text-2); font-size: 14px; }
.modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
.modal-footer .btn { flex: 1; }
.modal-wide { max-width: 640px; }

/* ---------- Toasts ---------- */
#toastRoot { position: fixed; top: calc(14px + env(safe-area-inset-top)); left: 0; right: 0; z-index: 200; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
.toast {
  background: rgba(20,21,29,0.92); border: 1px solid var(--glass-border); backdrop-filter: blur(16px);
  padding: 12px 18px; border-radius: 14px; font-size: 13.5px; font-weight: 600; max-width: 88vw;
  box-shadow: var(--shadow-1); opacity: 0; transform: translateY(-14px); transition: all 260ms var(--ease);
}
.toast.show { opacity: 1; transform: translateY(0); }
.toast-success { border-color: rgba(33,209,159,0.5); }
.toast-error { border-color: rgba(255,90,78,0.5); }

/* ============================================================
   FORMA — Stylesheet (Teil 2/2): Komponenten je Ansicht
   ============================================================ */

/* ---------- Rings & Dashboard ---------- */
.rings-row { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.rings-svg { display: block; }
.ring-progress { transition: stroke-dashoffset 900ms var(--ease); }
.rings-legend { flex: 1; min-width: 160px; display: flex; flex-direction: column; gap: 8px; }
.legend-item { font-size: 13px; color: var(--text-2); display: flex; align-items: center; }

.grid-dashboard { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
.stat-card { padding: 14px; margin-bottom: 0; }
.stat-label { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; margin-bottom: 6px; }
.stat-value { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
.stat-unit { font-size: 12px; color: var(--text-2); font-weight: 600; margin-left: 2px; }

.workout-mini { background: rgba(255,255,255,0.04); border-radius: 14px; padding: 10px 12px; cursor: pointer; transition: background 160ms var(--ease); margin-bottom: 6px; }
.workout-mini:hover { background: rgba(255,255,255,0.07); }
.workout-mini-date { font-size: 11px; color: var(--text-3); font-weight: 700; text-transform: uppercase; }
.workout-mini-name { font-weight: 700; font-size: 14px; margin: 2px 0; }
.workout-mini-meta { font-size: 12px; color: var(--text-2); }

.workout-summary-title { font-weight: 700; margin-bottom: 8px; }
.exercise-chip { display: inline-flex; align-items: center; background: rgba(255,255,255,0.05); border-radius: 10px; padding: 6px 10px; font-size: 12.5px; margin: 0 6px 6px 0; }

.pr-row { display: flex; align-items: center; padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
.pr-row:last-child { border-bottom: none; }
.pr-name { flex: 1; font-weight: 600; font-size: 13.5px; }
.pr-value { font-weight: 800; color: var(--teal-2); }

/* ---------- Trainingskarten ---------- */
.workout-card-head { display: flex; justify-content: space-between; align-items: flex-start; cursor: pointer; gap: 10px; margin: -4px -4px 0; padding: 4px; border-radius: 14px; }
.workout-card-head:active { background: rgba(255,255,255,0.04); }
.workout-card-date { font-size: 11px; color: var(--text-3); font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 3px; }
.workout-card-title { font-weight: 800; font-size: 16px; margin-bottom: 4px; }
.workout-card-actions { display: flex; gap: 6px; flex-shrink: 0; }
.workout-card-body { margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.06); }
.exercise-row { margin-bottom: 12px; }
.exercise-row:last-child { margin-bottom: 0; }
.exercise-row-head { font-size: 13.5px; margin-bottom: 6px; display: flex; align-items: center; }
.set-list { display: flex; flex-wrap: wrap; gap: 6px; }
.set-badge { background: rgba(255,255,255,0.05); border-radius: 8px; padding: 4px 9px; font-size: 12px; color: var(--text-2); }
.workout-notes { margin-top: 10px; font-size: 13px; color: var(--text-2); background: rgba(255,255,255,0.03); padding: 8px 10px; border-radius: 10px; }

.badge { display: inline-block; font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 8px; text-transform: uppercase; letter-spacing: 0.03em; }
.badge-planned { background: rgba(255,194,75,0.18); color: var(--amber); }

/* ---------- Workout-Formular (Modal) ---------- */
.exercise-draft { background: rgba(255,255,255,0.035); border: 1px solid var(--glass-border); border-radius: 16px; padding: 12px; margin-bottom: 12px; }
.exercise-draft-head { display: flex; gap: 8px; margin-bottom: 10px; }
.ex-name-input { flex: 1; min-width: 0; }
.ex-group-select { width: 116px; flex-shrink: 0; }
.set-table { overflow-x: auto; margin-bottom: 8px; -webkit-overflow-scrolling: touch; }
.set-table-head, .set-table-row { display: grid; grid-template-columns: 22px 58px 58px 50px 58px 1fr 26px; gap: 6px; align-items: center; min-width: 420px; padding: 4px 0; }
.set-table-head { color: var(--text-3); font-size: 10px; text-transform: uppercase; font-weight: 700; }
.set-table-row input { padding: 7px 8px; font-size: 13px; border-radius: 9px; }

/* ---------- Ernährung ---------- */
.date-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.date-nav-label { font-weight: 800; font-size: 15px; }
.score-row { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.score-ring-wrap { position: relative; width: 116px; height: 116px; flex-shrink: 0; }
.score-ring-wrap svg { width: 100%; height: 100%; }
.score-ring-label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; font-size: 25px; font-weight: 800; }
.score-ring-label span { font-size: 11px; color: var(--text-2); font-weight: 600; }
.macro-bars { flex: 1; min-width: 180px; display: flex; flex-direction: column; gap: 10px; }
.macro-bar-top { display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 4px; color: var(--text-2); }
.macro-bar-track { height: 7px; border-radius: 6px; background: rgba(255,255,255,0.06); overflow: hidden; }
.macro-bar-fill { height: 100%; border-radius: 6px; transition: width 500ms var(--ease); }

.extras-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.extra-item { background: rgba(255,255,255,0.035); border-radius: 14px; padding: 10px 12px; }
.extra-label { font-size: 12.5px; color: var(--text-2); margin-bottom: 8px; font-weight: 600; }
.extra-controls { display: flex; align-items: center; justify-content: space-between; font-weight: 800; font-size: 14px; }

.meal-card-actions { display: flex; align-items: center; gap: 10px; }
.food-row { display: grid; grid-template-columns: 1fr auto; grid-template-areas: "main del" "macros macros"; gap: 2px 10px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); align-items: center; }
.food-row:last-child { border-bottom: none; }
.food-row-main { grid-area: main; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.food-row-name { font-weight: 700; font-size: 13.5px; }
.food-row-amount { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.food-row-amount input { width: 62px; padding: 6px 8px; font-size: 13px; }
.food-row-macros { grid-area: macros; font-size: 11.5px; color: var(--text-2); }
.food-row > .btn-icon-sm { grid-area: del; }

.food-search-results { max-height: 280px; overflow-y: auto; margin-bottom: 12px; }
.food-search-row { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
.food-search-name { flex: 1; font-size: 13.5px; font-weight: 600; min-width: 0; }
.food-search-amount { width: 62px; flex-shrink: 0; padding: 7px 8px; }
.food-db-list { display: flex; flex-direction: column; gap: 10px; }
.food-db-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; gap: 10px; margin-bottom: 0; }
.food-db-name { font-weight: 700; margin-bottom: 3px; }
.food-db-actions { display: flex; gap: 6px; flex-shrink: 0; }

/* ---------- Kalender ---------- */
.calendar-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.calendar-nav-label { font-weight: 800; font-size: 16px; cursor: pointer; }
.calendar-weekdays { display: grid; grid-template-columns: repeat(7,1fr); text-align: center; color: var(--text-3); font-size: 11px; font-weight: 700; margin-bottom: 6px; }
.calendar-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 4px; }
.calendar-cell { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 12px; cursor: pointer; transition: background 150ms var(--ease); gap: 3px; }
.calendar-cell:not(.is-other-month):hover { background: rgba(255,255,255,0.05); }
.calendar-cell-day { font-size: 13px; font-weight: 600; }
.calendar-cell.is-other-month { cursor: default; }
.calendar-cell.is-other-month .calendar-cell-day { color: rgba(255,255,255,0.14); }
.calendar-cell.is-today { background: rgba(255,90,78,0.16); }
.calendar-cell.is-today .calendar-cell-day { color: var(--coral-2); font-weight: 800; }
.calendar-cell-dots { display: flex; gap: 3px; height: 6px; }
.cal-dot { width: 5px; height: 5px; border-radius: 50%; }
.cal-dot-workout { background: var(--coral-2); }
.cal-dot-food { background: var(--teal); }
.legend-row { display: flex; gap: 16px; margin-top: 14px; flex-wrap: wrap; }
.legend-row .legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-2); }

/* ---------- Körperdaten ---------- */
.body-entry-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; gap: 10px; }
.body-entry-date { font-weight: 700; margin-bottom: 3px; font-size: 13.5px; }

/* ---------- Statistik ---------- */
.donut-row { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.donut-chart-wrap { width: 140px; height: 140px; flex-shrink: 0; }
.heatmap-grid { display: flex; gap: 3px; overflow-x: auto; padding-bottom: 6px; -webkit-overflow-scrolling: touch; }
.heatmap-col { display: flex; flex-direction: column; gap: 3px; }
.heatmap-cell { width: 11px; height: 11px; border-radius: 3px; background: rgba(255,255,255,0.05); }
.heatmap-cell.lvl-1 { background: transparent; }
.heatmap-cell.lvl1 { background: rgba(33,209,159,0.28); }
.heatmap-cell.lvl2 { background: rgba(33,209,159,0.5); }
.heatmap-cell.lvl3 { background: rgba(33,209,159,0.74); }
.heatmap-cell.lvl4 { background: rgba(33,209,159,1); }

/* ---------- Mehr / Menü ---------- */
.more-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; margin-bottom: 16px; }
.more-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 22px 10px; cursor: pointer; font-weight: 700; font-size: 13.5px; text-align: center; transition: background 150ms var(--ease); margin-bottom: 0; }
.more-item:active { background: var(--glass-bg-strong); }
.more-icon { font-size: 26px; }

/* ---------- Lokaler Coach ---------- */
.ai-suggestions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.ai-chip { background: var(--glass-bg-strong); border: 1px solid var(--glass-border); border-radius: 999px; padding: 8px 14px; font-size: 12.5px; font-weight: 600; cursor: pointer; color: var(--text-1); }
.ai-chat { max-height: 380px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
.ai-message { padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.5; max-width: 88%; }
.ai-message-user { align-self: flex-end; background: linear-gradient(135deg, var(--coral-2), var(--coral)); color: #fff; border-bottom-right-radius: 5px; }
.ai-message-ai { align-self: flex-start; background: rgba(255,255,255,0.06); border-bottom-left-radius: 5px; }
.ai-input-row { display: flex; gap: 10px; margin-top: 12px; }
.ai-input-row input { flex: 1; }

/* ---------- Fokus-Stil (Barrierefreiheit) ---------- */
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

/* ---------- Responsive: Desktop-Sidebar ---------- */
@media (min-width: 560px) {
  .two-col { grid-template-columns: 1fr 1fr; }
}
@media (min-width: 900px) {
  #bottomNav { display: none; }
  #sideNav {
    display: flex; flex-direction: column; width: 224px; flex-shrink: 0; padding: 26px 14px;

/* ============================================================
   FORMA — Stylesheet Teil 3: Layout-Fixes & neue Komponenten
   (Mahlzeiten-Vorschläge, Fortschrittsreihen, Satz-Karten)
   ============================================================ */

/* ---------- Layout-Fix: flexible umbrechende Feldreihe (kein Überlappen mehr) ---------- */
.field-row { display: flex; gap: 10px; flex-wrap: wrap; }

/* ---------- Layout-Fix: Übungszeile im Workout-Formular ---------- */
.exercise-draft-sub { display: flex; gap: 8px; margin-bottom: 10px; }
.exercise-draft-sub .ex-group-select { flex: 1; min-width: 0; }

/* ---------- Layout-Fix: Sätze als Karten statt enger Tabelle (kein horizontales Scrollen mehr) ---------- */
.set-cards { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
.set-card { background: rgba(255,255,255,0.035); border: 1px solid rgba(255,255,255,0.06); border-radius: 14px; padding: 10px 12px; }

/* ---------- Einheitliche Fortschrittsreihen (Kalorien, Makros, Wasser, Obst, Gemüse, Schlaf ...) ---------- */
.progress-row { margin-bottom: 16px; }
.progress-row:last-child { margin-bottom: 0; }
.progress-row-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
.progress-row-label { font-size: 13.5px; font-weight: 700; }

.progress-row-fill { height: 100%; border-radius: 6px; transition: width 500ms var(--ease); }
.progress-row-fill.state-under { background: linear-gradient(90deg, var(--blue), #7cc0ff); }
.progress-row-fill.state-ok { background: linear-gradient(90deg, var(--teal), var(--teal-2)); }
.progress-row-fill.state-over { background: linear-gradient(90deg, var(--coral-2), var(--coral)); }
.progress-row-bottom { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 5px; }

.progress-row-status.status-over { color: var(--coral-2); font-weight: 700; }
.progress-row-controls { display: flex; gap: 6px; }

/* ---------- Mahlzeiten-Vorschlag (Frühstück/Mittagessen vor dem Hinzufügen) ---------- */
.meal-suggestion { border-style: dashed; border-color: rgba(255,255,255,0.14); }
.badge-suggestion { background: rgba(77,163,255,0.16); color: var(--blue); font-size: 10px; font-weight: 800; padding: 4px 10px; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.04em; }
.choice-group { margin-bottom: 10px; }

.choice-chip.active { background: linear-gradient(135deg, var(--coral-2), var(--coral)); border-color: transparent; color: #fff; }
.meal-suggestion-actions { display: flex; flex-direction: column; align-items: center; gap: 2px; }

/* ---------- Layout-Fix: Modal-Header darf nicht mit scrollendem Inhalt überlappen ---------- */
.modal-header {
  position: sticky; top: -20px; z-index: 5;
  background: #14151d; margin: -20px -20px 14px; padding: 20px 20px 14px;

@media (min-width: 620px) { .modal-header { top: -20px; } }
/* ---------- Layout-Fix: dynamische Viewport-Höhe berücksichtigt die Bildschirmtastatur ---------- */

/* ---------- Speicher-Warnbanner ---------- */

/* ---------- Cloud-Sync ---------- */

@keyframes pulseDot { 50% { opacity: 0.35; } }

<script>
'use strict';
/* ============================================================
   FORMA — Lokale Fitness- & Ernährungs-App
   100% lokal: keine Server, keine Cloud, kein Login.
   Alle Daten liegen ausschließlich im LocalStorage dieses Browsers.
   ============================================================ */

/* ---------------------------------------------------------
   Utils
--------------------------------------------------------- */
const Utils = {
  uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 9); },
  todayLocal() { return Utils.toLocalISODate(new Date()); },
  toLocalISODate(d) {
    const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  },
  parseLocalDate(iso) {
    const [y, m, d] = iso.split('-').map(Number);
    return new Date(y, m - 1, d);
  },
  addDays(iso, n) {
    const d = Utils.parseLocalDate(iso);
    d.setDate(d.getDate() + n);
    return Utils.toLocalISODate(d);
  },
  startOfWeek(iso) {
    const d = Utils.parseLocalDate(iso);
    const day = (d.getDay() + 6) % 7; // Montag = 0
    d.setDate(d.getDate() - day);
    return Utils.toLocalISODate(d);
  },
  startOfMonth(iso) { const d = Utils.parseLocalDate(iso); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-01`; },
  fmtDateHuman(iso) {
    const d = Utils.parseLocalDate(iso);
    return d.toLocaleDateString('de-DE', { day: '2-digit', month: 'long', year: 'numeric' });
  },
  fmtDateMed(iso) {
    const d = Utils.parseLocalDate(iso);
    return d.toLocaleDateString('de-DE', { day: '2-digit', month: 'short', year: 'numeric' });
  },
  fmtDateShort(iso) {
    const d = Utils.parseLocalDate(iso);
    return d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' });
  },
  weekdayShort(iso) {
    const d = Utils.parseLocalDate(iso);
    return d.toLocaleDateString('de-DE', { weekday: 'short' });
  },
  weekdayLong(iso) {
    const d = Utils.parseLocalDate(iso);
    return d.toLocaleDateString('de-DE', { weekday: 'long' });
  },
  round1(n) { return Math.round((Number(n) || 0) * 10) / 10; },
  round(n) { return Math.round(Number(n) || 0); },
  clamp(n, min, max) { return Math.max(min, Math.min(max, n)); },
  debounce(fn, ms) { let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); }; },
  escapeHtml(str) {
    return String(str ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  },
  monthNamesDe: ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'],
  monthNamesShortDe: ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'],
  weekdayLettersDe: ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'],
  fmtNum(n, decimals = 0) {
    if (n === null || n === undefined || isNaN(n)) return '–';
    return Number(n).toLocaleString('de-DE', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
  },
};

/* ---------------------------------------------------------
   Konstanten & Seed-Daten
--------------------------------------------------------- */
const STORAGE_KEY = 'forma_data_v1';

const DEFAULT_GOALS = {
  kcal: 2400, protein: 150, fat: 70, carbs: 270, carbsMin: 260, carbsMax: 280,
  fiberMin: 35, fiberMax: 45,
  saltMin: 5, saltMax: 6,
  waterMin: 3.0, waterMax: 4.0,
  fruitServings: 2,
  vegMin: 300, vegMax: 500,
  sleepMin: 8, sleepMax: 10,
};

const MUSCLE_GROUPS = ['Brust', 'Rücken', 'Beine', 'Schultern', 'Bizeps', 'Trizeps', 'Bauch', 'Waden', 'Ganzkörper', 'Cardio'];

const GROUP_COLORS = {
  'Brust': '#ff5a4e', 'Rücken': '#9b6bff', 'Beine': '#21d19f', 'Schultern': '#ffc24b',
  'Bizeps': '#4da3ff', 'Trizeps': '#ff6fa8', 'Bauch': '#b8e986', 'Waden': '#5eead4',
  'Ganzkörper': '#c7cbe0', 'Cardio': '#ff8a3d',
};
function groupColor(g) { return GROUP_COLORS[g] || '#9296a3'; }

const SEED_EXERCISES = [
  ['Bankdrücken', 'Brust'], ['Schrägbankdrücken', 'Brust'], ['Kurzhantel Fliegende', 'Brust'], ['Dips', 'Brust'],
  ['Klimmzüge', 'Rücken'], ['Rudern vorgebeugt', 'Rücken'], ['Latzug', 'Rücken'], ['Kreuzheben', 'Rücken'], ['Kabelrudern', 'Rücken'],
  ['Kniebeugen', 'Beine'], ['Beinpresse', 'Beine'], ['Ausfallschritte', 'Beine'], ['Beinstrecker', 'Beine'], ['Beinbeuger', 'Beine'],
  ['Schulterdrücken', 'Schultern'], ['Seitheben', 'Schultern'], ['Frontheben', 'Schultern'], ['Face Pulls', 'Schultern'],
  ['Bizepscurls', 'Bizeps'], ['Hammercurls', 'Bizeps'],
  ['Trizepsdrücken', 'Trizeps'], ['French Press', 'Trizeps'],
  ['Crunches', 'Bauch'], ['Plank', 'Bauch'], ['Beinheben', 'Bauch'],
  ['Wadenheben', 'Waden'],
  ['Laufen', 'Cardio'], ['Rudergerät', 'Cardio'], ['Radfahren', 'Cardio'],
];

// [name, unit('g'|'stk'), refAmount, kcal, protein, carbs, fat, fiber, sugar, salt] — Werte je refAmount
const SEED_FOODS = [
  ['Hähnchenbrust (gegart)', 'g', 100, 165, 31, 0, 3.6, 0, 0, 0.1],
  ['Reis (gekocht)', 'g', 100, 130, 2.7, 28, 0.3, 0.4, 0.1, 0],
  ['Haferflocken', 'g', 100, 371, 13.5, 58, 7, 10, 1, 0],
  ['Magerquark', 'g', 100, 67, 12, 4, 0.2, 0, 4, 0.1],
  ['Himbeeren', 'g', 100, 52, 1.2, 12, 0.6, 6.5, 4.4, 0],
  ['Champignons', 'g', 100, 22, 3, 3, 0.3, 1, 2, 0],
  ['Olivenöl', 'g', 100, 884, 0, 0, 100, 0, 0, 0],
  ['Mandeln', 'g', 100, 579, 21, 22, 50, 12.5, 4.8, 0],
  ['Ei', 'stk', 1, 78, 6.5, 0.6, 5.3, 0, 0.3, 0.2],
  ['Banane', 'g', 100, 89, 1.1, 23, 0.3, 2.6, 12, 0],
  ['Vollkornbrot', 'g', 100, 247, 9, 41, 4, 7, 3, 1.1],
  ['Naturjoghurt (1,5%)', 'g', 100, 57, 4.5, 6, 1.5, 0, 6, 0.1],
  ['Kartoffeln (gekocht)', 'g', 100, 87, 2, 20, 0.1, 1.8, 0.8, 0],
  ['Lachs', 'g', 100, 208, 20, 0, 13, 0, 0, 0.1],
  ['Rinderhack (mager)', 'g', 100, 172, 20, 0, 10, 0, 0, 0.1],
  ['Brokkoli', 'g', 100, 34, 2.8, 7, 0.4, 2.6, 1.7, 0],
  ['Paprika', 'g', 100, 31, 1, 6, 0.3, 2.1, 4.2, 0],
  ['Milch (1,5%)', 'g', 100, 47, 3.4, 4.9, 1.5, 0, 4.9, 0.1],
  ['Reis (ungekocht)', 'g', 100, 360, 7, 79, 0.6, 1.3, 0.1, 0],
  ['Nudeln (ungekocht)', 'g', 100, 360, 12, 72, 1.5, 3, 2, 0],
  ['Walnüsse', 'g', 100, 654, 15, 14, 65, 6.7, 2.6, 0],
];

function buildDefaultData() {
  const foods = SEED_FOODS.map(([name, unit, ref, kcal, protein, carbs, fat, fiber, sugar, salt]) => ({
    id: Utils.uid(), name, unit, ref, kcal, protein, carbs, fat,
    fiber: fiber || 0, sugar: sugar || 0, salt: salt || 0, custom: false,
  }));
  const byName = n => foods.find(f => f.name === n);
  const exercises = SEED_EXERCISES.map(([name, group]) => ({ id: Utils.uid(), name, group, custom: false }));
  return {
    version: 1,
    goals: { ...DEFAULT_GOALS },
    foods,
    mealTemplates: {
      breakfast: {
        name: 'Frühstück (Standard)',
        items: [
          { foodId: byName('Magerquark').id, amount: 500 },
          { foodId: byName('Haferflocken').id, amount: 60 },
          { foodId: byName('Himbeeren').id, amount: 175 },
        ],
        choices: [
          { label: 'Nüsse', selectedIndex: 0, options: [
            { foodId: byName('Mandeln').id, amount: 20, label: 'Mandeln' },
            { foodId: byName('Walnüsse').id, amount: 20, label: 'Walnüsse' },
          ] },
        ],
      },
      lunch: {
        name: 'Mittagessen (Standard)',
        items: [
          { foodId: byName('Hähnchenbrust (gegart)').id, amount: 300 },
          { foodId: byName('Brokkoli').id, amount: 30 },
          { foodId: byName('Olivenöl').id, amount: 10 },
        ],
        choices: [
          { label: 'Kohlenhydrat-Beilage', selectedIndex: 0, options: [
            { foodId: byName('Reis (ungekocht)').id, amount: 70, label: 'Reis (ungekocht)' },
            { foodId: byName('Kartoffeln (gekocht)').id, amount: 350, label: 'Kartoffeln' },
            { foodId: byName('Nudeln (ungekocht)').id, amount: 70, label: 'Nudeln (ungekocht)' },
          ] },
        ],
      },
    },
    nutritionLogs: {},
    exercises,
    workouts: [],
    bodyData: [],
  };
}

/* ---------------------------------------------------------
   Store — LocalStorage Persistenz mit Fehlerbehandlung
--------------------------------------------------------- */
const Store = {
  data: null,
  load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) { this.data = buildDefaultData(); this.save(); return; }
      const parsed = JSON.parse(raw);
      this.data = Store.migrate(parsed);
    } catch (e) {
      console.error('Ladefehler — verwende Standarddaten', e);
      this.data = buildDefaultData();
    }
  },
  migrate(d) {
    const def = buildDefaultData();
    if (!d || typeof d !== 'object') return def;
    d.goals = { ...def.goals, ...(d.goals || {}) };
    d.foods = Array.isArray(d.foods) && d.foods.length ? d.foods : def.foods;
    d.foods.forEach(f => { f.fiber = f.fiber || 0; f.sugar = f.sugar || 0; f.salt = f.salt || 0; if (!f.unit) f.unit = 'g'; if (!f.ref) f.ref = 100; });
    d.mealTemplates = d.mealTemplates && d.mealTemplates.breakfast && d.mealTemplates.lunch ? d.mealTemplates : def.mealTemplates;
    ['breakfast', 'lunch'].forEach(mt => {
      const tmpl = d.mealTemplates[mt];
      if (!Array.isArray(tmpl.items)) tmpl.items = [];
      if (!Array.isArray(tmpl.choices)) tmpl.choices = [];
      tmpl.choices.forEach(c => { if (typeof c.selectedIndex !== 'number') c.selectedIndex = 0; if (!Array.isArray(c.options)) c.options = []; });
    });
    d.nutritionLogs = d.nutritionLogs && typeof d.nutritionLogs === 'object' ? d.nutritionLogs : {};
    d.exercises = Array.isArray(d.exercises) && d.exercises.length ? d.exercises : def.exercises;
    d.workouts = Array.isArray(d.workouts) ? d.workouts : [];
    d.workouts.forEach(w => { if (!Array.isArray(w.exercises)) w.exercises = []; w.exercises.forEach(ex => { if (!Array.isArray(ex.sets)) ex.sets = []; }); });
    d.bodyData = Array.isArray(d.bodyData) ? d.bodyData : [];
    d.version = 1;
    return d;
  },
  save(opts) {
    try {
      const json = JSON.stringify(this.data);
      localStorage.setItem(STORAGE_KEY, json);
      const verify = localStorage.getItem(STORAGE_KEY);
      if (verify !== json) {
        console.error('Speicher-Verifikation fehlgeschlagen: zurückgelesener Wert weicht vom geschriebenen Wert ab.');
        UI.toast('Achtung: Speichern konnte nicht verifiziert werden — bitte Browser-Einstellungen prüfen (z. B. privater Modus).', 'error', 6000);
        return false;
      }
      if (!(opts && opts.skipSync)) Sync.schedulePush();
      return true;
    } catch (e) {
      console.error('Speicherfehler', e);
      if (e && e.name === 'QuotaExceededError') {
        UI.toast('Speicher ist voll. Bitte exportiere deine Daten (Mehr → Export) und leere ggf. alte Einträge.', 'error', 5000);
      } else {
        UI.toast('Fehler beim Speichern der Daten — bitte prüfe, ob privater/inkognito Modus aktiv ist.', 'error', 5000);
      }
      return false;
    }
  },
  testStorageWritable() {
    try {
      const testKey = '__forma_storage_test__';
      localStorage.setItem(testKey, '1');
      const ok = localStorage.getItem(testKey) === '1';
      localStorage.removeItem(testKey);
      return ok;
    } catch (e) {
      return false;
    }
  },
  getDiagnostics() {
    const result = { writable: false, sizeKB: 0, hasData: false, error: null };
    try {
      const testKey = '__forma_storage_test__';
      const testVal = 'ok-' + Date.now();
      localStorage.setItem(testKey, testVal);
      result.writable = localStorage.getItem(testKey) === testVal;
      localStorage.removeItem(testKey);
    } catch (e) {
      result.writable = false;
      result.error = e && e.message;
    }
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      result.hasData = !!raw;
      result.sizeKB = raw ? Math.round((raw.length / 1024) * 10) / 10 : 0;
    } catch (e) { result.error = result.error || (e && e.message); }
    return result;
  },
  flushNow() {
    try { if (this.data) localStorage.setItem(STORAGE_KEY, JSON.stringify(this.data)); } catch (e) { /* bestmöglich, Seite wird ohnehin geschlossen */ }
  },
};

/* ---------------------------------------------------------
   Nutrition — Lebensmittel, Mahlzeiten, Tagesübersicht, Score
--------------------------------------------------------- */
const Nutrition = {
  getFood(id) { return Store.data.foods.find(f => f.id === id); },
  computeItemMacros(item) {
    const f = Nutrition.getFood(item.foodId);
    if (!f) return { kcal: 0, protein: 0, carbs: 0, fat: 0, fiber: 0, sugar: 0, salt: 0 };
    const factor = (Number(item.amount) || 0) / f.ref;
    return {
      kcal: f.kcal * factor, protein: f.protein * factor, carbs: f.carbs * factor, fat: f.fat * factor,
      fiber: (f.fiber || 0) * factor, sugar: (f.sugar || 0) * factor, salt: (f.salt || 0) * factor,
    };
  },
  sumMacros(items) {
    return (items || []).reduce((acc, it) => {
      const m = Nutrition.computeItemMacros(it);
      acc.kcal += m.kcal; acc.protein += m.protein; acc.carbs += m.carbs; acc.fat += m.fat;
      acc.fiber += m.fiber; acc.sugar += m.sugar; acc.salt += m.salt;
      return acc;
    }, { kcal: 0, protein: 0, carbs: 0, fat: 0, fiber: 0, sugar: 0, salt: 0 });
  },
  getDayLog(date) {
    return Store.data.nutritionLogs[date] || { meals: { breakfast: null, lunch: null, dinner: [] }, water: 0, fruitServings: 0, vegGrams: 0, sleepHours: null };
  },
  ensureDayLog(date) {
    if (!Store.data.nutritionLogs[date]) {
      Store.data.nutritionLogs[date] = { meals: { breakfast: null, lunch: null, dinner: [] }, water: 0, fruitServings: 0, vegGrams: 0, sleepHours: null };
    }
    return Store.data.nutritionLogs[date];
  },
  getMealItems(date, mealType) {
    // Frühstück/Mittagessen zählen NUR, wenn sie für diesen Tag aktiv hinzugefügt wurden (materialisiertes Array).
    // Solange nur der Vorschlag existiert (null), fließt nichts in die Tagesbilanz ein.
    const log = Nutrition.getDayLog(date);
    if (mealType === 'dinner') return log.meals.dinner || [];
    return log.meals[mealType] || [];
  },
  isMealAdded(date, mealType) {
    if (mealType === 'dinner') return true;
    const log = Nutrition.getDayLog(date);
    return Array.isArray(log.meals[mealType]);
  },
  isOverridden(date, mealType) { return Nutrition.isMealAdded(date, mealType); },
  setMealItems(date, mealType, items) {
    const log = Nutrition.ensureDayLog(date);
    if (mealType === 'dinner') log.meals.dinner = items;
    else log.meals[mealType] = items;
    Store.save();
  },
  resetToTemplate(date, mealType) {
    if (mealType === 'dinner') return;
    const log = Nutrition.ensureDayLog(date);
    log.meals[mealType] = null;
    Store.save();
  },
  getResolvedTemplateItems(mealType) {
    const tmpl = Store.data.mealTemplates[mealType];
    if (!tmpl) return [];
    const fixed = (tmpl.items || []).map(it => ({ foodId: it.foodId, amount: it.amount }));
    const fromChoices = (tmpl.choices || []).map(c => c.options[c.selectedIndex] || c.options[0]).filter(Boolean).map(o => ({ foodId: o.foodId, amount: o.amount }));
    return [...fixed, ...fromChoices];
  },
  getTemplatePreviewTotals(mealType) { return Nutrition.sumMacros(Nutrition.getResolvedTemplateItems(mealType)); },
  selectChoice(mealType, choiceIndex, optionIndex) {
    const tmpl = Store.data.mealTemplates[mealType];
    if (!tmpl || !tmpl.choices[choiceIndex]) return;
    tmpl.choices[choiceIndex].selectedIndex = optionIndex;
    Store.save();
  },
  addTemplateToDay(date, mealType) {
    const items = Nutrition.getResolvedTemplateItems(mealType).map(it => ({ ...it }));
    Nutrition.setMealItems(date, mealType, items);
  },
  addItemToMeal(date, mealType, foodId, amount) {
    const items = [...Nutrition.getMealItems(date, mealType)];
    items.push({ foodId, amount: Number(amount) || 0 });
    Nutrition.setMealItems(date, mealType, items);
  },
  removeItemFromMeal(date, mealType, index) {
    const items = [...Nutrition.getMealItems(date, mealType)];
    items.splice(index, 1);
    Nutrition.setMealItems(date, mealType, items);
  },
  updateItemAmount(date, mealType, index, amount) {
    const items = [...Nutrition.getMealItems(date, mealType)];
    if (items[index]) items[index] = { ...items[index], amount: Number(amount) || 0 };
    Nutrition.setMealItems(date, mealType, items);
  },
  setExtras(date, extras) {
    const log = Nutrition.ensureDayLog(date);
    Object.assign(log, extras);
    Store.save();
  },
  getDayTotals(date) {
    const log = Nutrition.getDayLog(date);
    const b = Nutrition.getMealItems(date, 'breakfast');
    const l = Nutrition.getMealItems(date, 'lunch');
    const d = Nutrition.getMealItems(date, 'dinner');
    const totals = Nutrition.sumMacros([...b, ...l, ...d]);
    return { ...totals, water: log.water || 0, fruitServings: log.fruitServings || 0, vegGrams: log.vegGrams || 0, sleepHours: log.sleepHours };
  },
  evaluateGoal(value, min, max, overIsGood) {
    if (value < min) return { state: 'under', met: false };
    if (max != null && value > max) return { state: overIsGood ? 'ok' : 'over', met: !!overIsGood };
    return { state: 'ok', met: true };
  },
  scoreDay(date) {
    const t = Nutrition.getDayTotals(date);
    const g = Store.data.goals;
    let score = 0;
    const kcalDevPct = g.kcal ? Math.abs(t.kcal - g.kcal) / g.kcal : 0;
    score += 20 * Utils.clamp(1 - kcalDevPct / 0.3, 0, 1);
    score += 20 * Utils.clamp(t.protein / g.protein, 0, 1);
    score += 10 * (t.carbs >= g.carbsMin && t.carbs <= g.carbsMax ? 1 : Utils.clamp(1 - Math.min(Math.abs(t.carbs - g.carbsMin), Math.abs(t.carbs - g.carbsMax)) / g.carbsMax, 0, 1));
    score += 10 * Utils.clamp(1 - Math.abs(t.fat - g.fat) / g.fat, 0, 1);
    score += 15 * Utils.clamp(t.fiber / g.fiberMin, 0, 1);
    score += 10 * (t.salt <= g.saltMax ? 1 : Utils.clamp(1 - (t.salt - g.saltMax) / g.saltMax, 0, 1));
    score += 10 * Utils.clamp(t.water / g.waterMin, 0, 1);
    score += 2.5 * Utils.clamp(t.fruitServings / g.fruitServings, 0, 1);
    score += 2.5 * Utils.clamp(t.vegGrams / g.vegMin, 0, 1);
    return Utils.round(Utils.clamp(score, 0, 100));
  },
  addFood(food) {
    const f = { id: Utils.uid(), custom: true, fiber: 0, sugar: 0, salt: 0, ...food };
    Store.data.foods.push(f);
    Store.save();
    return f;
  },
  updateFood(id, patch) {
    const f = Nutrition.getFood(id);
    if (f) { Object.assign(f, patch); Store.save(); }
  },
  deleteFood(id) {
    Store.data.foods = Store.data.foods.filter(f => f.id !== id);
    Store.save();
  },
  maxAmountFitting(food) {
    const totals = Nutrition.getDayTotals(Utils.todayLocal());
    const g = Store.data.goals;
    const remaining = { kcal: g.kcal - totals.kcal, carbs: g.carbsMax - totals.carbs, fat: g.fat - totals.fat };
    const perRef = { kcal: food.kcal, carbs: food.carbs, fat: food.fat };
    const candidates = [];
    if (perRef.kcal > 0) candidates.push({ label: 'Kalorien', amount: remaining.kcal / perRef.kcal * food.ref });
    if (perRef.carbs > 0) candidates.push({ label: 'Kohlenhydrate', amount: remaining.carbs / perRef.carbs * food.ref });
    if (perRef.fat > 0) candidates.push({ label: 'Fett', amount: remaining.fat / perRef.fat * food.ref });
    const valid = candidates.filter(c => isFinite(c.amount));
    const unit = food.unit === 'stk' ? 'Stk' : 'g';
    if (!valid.length) return { amount: 0, limiter: null, unit };
    valid.sort((a, b) => a.amount - b.amount);
    return { amount: Math.max(0, Utils.round(valid[0].amount)), limiter: valid[0].label, unit };
  },
  suggestFoodsForMacro(macro, targetAmount) {
    const candidates = Store.data.foods.filter(f => (f[macro] || 0) > 0).map(f => ({ f, perRef: f[macro] }));
    candidates.sort((a, b) => b.perRef - a.perRef);
    return candidates.slice(0, 4).map(c => ({ food: c.f, neededAmount: Utils.round(targetAmount * c.f.ref / c.perRef) }));
  },
  suggestFoodsGeneral() {
    const totals = Nutrition.getDayTotals(Utils.todayLocal());
    const g = Store.data.goals;
    const remainingKcal = g.kcal - totals.kcal;
    const remainingProtein = g.protein - totals.protein;
    if (remainingKcal <= 30) return null;
    const preferProtein = remainingProtein > 0 && (remainingProtein / g.protein) > (remainingKcal / g.kcal);
    let list = Store.data.foods.filter(f => (f.kcal * (100 / f.ref)) <= remainingKcal * 1.3);
    list = list.map(f => ({ f, ratio: f.kcal > 0 ? f.protein / f.kcal : 0 }));
    list.sort((a, b) => preferProtein ? b.ratio - a.ratio : a.f.kcal - b.f.kcal);
    return { items: list.slice(0, 4).map(x => x.f), preferProtein, remainingKcal: Utils.round(remainingKcal), remainingProtein: Utils.round1(remainingProtein) };
  },
  suggestAlternativeFood(food) {
    const ratio = f => f.kcal > 0 ? f.protein / f.kcal : 0;
    const baseRatio = ratio(food);
    return Store.data.foods.filter(f => f.id !== food.id && ratio(f) > baseRatio * 1.1).sort((a, b) => ratio(b) - ratio(a)).slice(0, 3);
  },
  avgOverDays(numDays) {
    const today = Utils.todayLocal();
    let sums = { kcal: 0, protein: 0, carbs: 0, fat: 0 }, count = 0;
    for (let i = 0; i < numDays; i++) {
      const date = Utils.addDays(today, -i);
      if (!Store.data.nutritionLogs[date] && i !== 0) continue;
      const t = Nutrition.getDayTotals(date);
      if (t.kcal === 0 && !Store.data.nutritionLogs[date]) continue;
      sums.kcal += t.kcal; sums.protein += t.protein; sums.carbs += t.carbs; sums.fat += t.fat; count++;
    }
    if (!count) return null;
    return { kcal: sums.kcal / count, protein: sums.protein / count, carbs: sums.carbs / count, fat: sums.fat / count, days: count };
  },
};

/* ---------------------------------------------------------
   Training — Workouts, Übungen, Sätze, Fortschritt
--------------------------------------------------------- */
const Training = {
  addExerciseDef(name, group) {
    let ex = Store.data.exercises.find(e => e.name.toLowerCase() === name.toLowerCase());
    if (ex) return ex;
    ex = { id: Utils.uid(), name, group, custom: true };
    Store.data.exercises.push(ex);
    Store.save();
    return ex;
  },
  saveWorkout(data, existingId) {
    if (existingId) {
      const w = Training.getWorkout(existingId);
      if (w) Object.assign(w, data);
    } else {
      Store.data.workouts.push({ id: Utils.uid(), ...data });
    }
    Store.data.workouts.sort((a, b) => a.date.localeCompare(b.date) || (a.time || '').localeCompare(b.time || ''));
    Store.save();
  },
  deleteWorkout(id) {
    Store.data.workouts = Store.data.workouts.filter(w => w.id !== id);
    Store.save();
  },
  getWorkout(id) { return Store.data.workouts.find(w => w.id === id); },
  getWorkoutsOnDate(date) { return Store.data.workouts.filter(w => w.date === date); },
  workoutsUpToToday() {
    const t = Utils.todayLocal();
    return Store.data.workouts.filter(w => w.date <= t).sort((a, b) => b.date.localeCompare(a.date));
  },
  plannedWorkouts() {
    const t = Utils.todayLocal();
    return Store.data.workouts.filter(w => w.date > t).sort((a, b) => a.date.localeCompare(b.date));
  },
  nextPlanned() { return Training.plannedWorkouts()[0] || null; },
  lastCompleted() { return Training.workoutsUpToToday()[0] || null; },
  volumeOfWorkout(w) {
    return (w.exercises || []).reduce((sum, ex) => sum + (ex.sets || []).reduce((s, set) => s + (Number(set.weight) || 0) * (Number(set.reps) || 0), 0), 0);
  },
  setsCountOfWorkout(w) {
    return (w.exercises || []).reduce((s, ex) => s + (ex.sets || []).length, 0);
  },
  streak() {
    let count = 0;
    let cursor = Utils.todayLocal();
    const hasWorkout = date => Store.data.workouts.some(w => w.date === date);
    if (!hasWorkout(cursor)) cursor = Utils.addDays(cursor, -1);
    while (hasWorkout(cursor)) { count++; cursor = Utils.addDays(cursor, -1); }
    return count;
  },
  allSetsForExercise(nameOrId) {
    const results = [];
    Store.data.workouts.forEach(w => {
      (w.exercises || []).forEach(ex => {
        if (ex.exerciseId === nameOrId || ex.name === nameOrId) {
          (ex.sets || []).forEach(s => results.push({ date: w.date, workoutId: w.id, ...s }));
        }
      });
    });
    return results.sort((a, b) => a.date.localeCompare(b.date));
  },
  estimate1RM(weight, reps) {
    weight = Number(weight) || 0; reps = Number(reps) || 0;
    if (!reps || reps <= 1) return weight;
    return weight * (1 + reps / 30);
  },
  exerciseStats(nameOrId) {
    const sets = Training.allSetsForExercise(nameOrId).filter(s => (Number(s.weight) || 0) > 0 || (Number(s.reps) || 0) > 0);
    if (!sets.length) return null;
    let best1rm = 0, bestSet = null, maxWeight = 0, sumWeight = 0, sumReps = 0;
    sets.forEach(s => {
      const w = Number(s.weight) || 0, r = Number(s.reps) || 0;
      const e1 = Training.estimate1RM(w, r);
      if (e1 > best1rm) { best1rm = e1; bestSet = s; }
      if (w > maxWeight) maxWeight = w;
      sumWeight += w; sumReps += r;
    });
    return {
      sets, best1rm: Utils.round1(best1rm), bestSet, maxWeight,
      avgWeight: Utils.round1(sumWeight / sets.length), avgReps: Utils.round1(sumReps / sets.length),
      totalVolume: sets.reduce((s, x) => s + (Number(x.weight) || 0) * (Number(x.reps) || 0), 0),
      firstDate: sets[0].date, lastDate: sets[sets.length - 1].date,
    };
  },
  volumeByMuscleGroup(sinceDate) {
    const map = {};
    Store.data.workouts.forEach(w => {
      if (w.date > Utils.todayLocal()) return;
      if (sinceDate && w.date < sinceDate) return;
      (w.exercises || []).forEach(ex => {
        const vol = (ex.sets || []).reduce((s, set) => s + (Number(set.weight) || 0) * (Number(set.reps) || 0), 0);
        map[ex.group] = (map[ex.group] || 0) + vol;
      });
    });
    return map;
  },
  workoutsInRange(fromDate, toDate) {
    return Store.data.workouts.filter(w => w.date >= fromDate && w.date <= toDate && w.date <= Utils.todayLocal());
  },
  allPRs() {
    const names = [...new Set(Store.data.workouts.flatMap(w => (w.exercises || []).map(ex => ex.name)))];
    return names.map(n => ({ name: n, stats: Training.exerciseStats(n) }))
      .filter(x => x.stats)
      .sort((a, b) => b.stats.best1rm - a.stats.best1rm);
  },
  fastestImproving() {
    const names = [...new Set(Store.data.workouts.flatMap(w => (w.exercises || []).map(ex => ex.name)))];
    let best = null;
    names.forEach(n => {
      const sets = Training.allSetsForExercise(n).filter(s => (Number(s.weight) || 0) > 0);
      if (sets.length < 2) return;
      const firstE1 = Training.estimate1RM(sets[0].weight, sets[0].reps);
      const lastE1 = Training.estimate1RM(sets[sets.length - 1].weight, sets[sets.length - 1].reps);
      if (firstE1 <= 0) return;
      const pct = (lastE1 - firstE1) / firstE1 * 100;
      if (!best || pct > best.pct) best = { name: n, pct, firstE1, lastE1 };
    });
    return best;
  },
  exercisesInGroup(group) {
    return [...new Set(Store.data.exercises.filter(e => e.group === group).map(e => e.name))];
  },
  alternativesForExercise(name) {
    const ex = Store.data.exercises.find(e => e.name.toLowerCase() === name.toLowerCase());
    if (!ex) return [];
    return Store.data.exercises.filter(e => e.group === ex.group && e.name.toLowerCase() !== ex.name.toLowerCase()).map(e => e.name);
  },
};

/* ---------------------------------------------------------
   Search — Trainingssuche
--------------------------------------------------------- */
const Search = {
  run(filters) {
    return Store.data.workouts.filter(w => {
      if (filters.dateFrom && w.date < filters.dateFrom) return false;
      if (filters.dateTo && w.date > filters.dateTo) return false;
      if (filters.group && !(w.exercises || []).some(ex => ex.group === filters.group)) return false;
      if (filters.exercise && !(w.exercises || []).some(ex => ex.name.toLowerCase().includes(filters.exercise.toLowerCase()))) return false;
      if (filters.minWeight && !(w.exercises || []).some(ex => (ex.sets || []).some(s => (Number(s.weight) || 0) >= Number(filters.minWeight)))) return false;
      if (filters.text) {
        const hay = (w.name + ' ' + (w.notes || '') + ' ' + (w.exercises || []).map(ex => ex.name + ' ' + (ex.sets || []).map(s => s.note || '').join(' ')).join(' ')).toLowerCase();
        if (!hay.includes(filters.text.toLowerCase())) return false;
      }
      return true;
    }).sort((a, b) => b.date.localeCompare(a.date));
  },
};

/* ---------------------------------------------------------
   Export / Import
--------------------------------------------------------- */
const ExportImport = {
  downloadBlob(content, filename, type) {
    const blob = new Blob([content], { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  },
  exportJSON() {
    try {
      ExportImport.downloadBlob(JSON.stringify(Store.data, null, 2), `forma-backup-${Utils.todayLocal()}.json`, 'application/json');
      UI.toast('Backup wurde heruntergeladen ✓', 'success');
    } catch (e) { console.error(e); UI.toast('Export fehlgeschlagen.', 'error'); }
  },
  exportWorkoutsCSV() {
    try {
      const rows = [['Datum', 'Workout', 'Uebung', 'Muskelgruppe', 'Satz', 'Gewicht_kg', 'Wiederholungen', 'RPE', 'Pause_s', 'Notiz']];
      Store.data.workouts.forEach(w => {
        (w.exercises || []).forEach(ex => {
          (ex.sets || []).forEach((s, i) => {
            rows.push([w.date, w.name, ex.name, ex.group, i + 1, s.weight ?? '', s.reps ?? '', s.rpe ?? '', s.pause ?? '', (s.note || '').replace(/[\n,"]/g, ' ')]);
          });
        });
      });
      const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\r\n');
      ExportImport.downloadBlob('\uFEFF' + csv, `forma-trainings-${Utils.todayLocal()}.csv`, 'text/csv;charset=utf-8');
      UI.toast('CSV wurde heruntergeladen ✓', 'success');
    } catch (e) { console.error(e); UI.toast('CSV-Export fehlgeschlagen.', 'error'); }
  },
  importJSON(file, cb) {
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const parsed = JSON.parse(e.target.result);
        if (!parsed || typeof parsed !== 'object' || !('foods' in parsed) || !('workouts' in parsed)) {
          throw new Error('Datei enthält keine gültigen FORMA-Daten');
        }
        Store.data = Store.migrate(parsed);
        Store.save();
        UI.toast('Daten erfolgreich importiert ✓', 'success');
        if (cb) cb(true);
      } catch (err) {
        console.error(err);
        UI.toast('Import fehlgeschlagen: Datei ungültig oder beschädigt.', 'error');
        if (cb) cb(false);
      }
    };
    reader.onerror = () => { UI.toast('Datei konnte nicht gelesen werden.', 'error'); if (cb) cb(false); };
    reader.readAsText(file);
  },
};
